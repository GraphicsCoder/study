<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="大象">
  <!-- 标签页图标：绿底白象（侧面象头）。16px 下细节全糊，所以只留轮廓：
       左边身子、右边脑袋两个圆叠出身形，一条向下再上翘的鼻子，一个眼睛。
       左边那个圆比脑袋大一点，象才站得住；两个一样大看着像两颗球。
       耳朵原本描了一道绿弧线，小尺寸下只剩一道脏线，去掉——整只全白、
       只留眼睛反而更像大象。牙、腿、尾巴同理，一概不画。 -->
  <rect width="64" height="64" rx="14" fill="#0e8a6e"/>
  <g fill="#fff">
    <circle cx="22" cy="29" r="16"/>
    <circle cx="41" cy="30" r="13.5"/>
  </g>
  <path d="M43 38c0 8-8 9-8 15 0 4 4 6 8 4"
        fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="45" cy="26" r="2.6" fill="#0e8a6e"/>
</svg>
