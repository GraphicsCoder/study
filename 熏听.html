<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英语熏听 · 磨耳朵</title>
<style>
  :root{
    --bg:#f5f7fb; --card:#fff; --ink:#1f2430; --muted:#6b7280;
    --line:#e5e7eb; --brand:#0284c7; --brand-soft:#e6f4fd;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);line-height:1.65;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}

  header.top{background:linear-gradient(135deg,#0ea5e9,#6366f1);color:#fff;
    border-radius:16px;padding:20px 22px;margin-bottom:16px}
  header.top h1{margin:0 0 6px;font-size:23px;letter-spacing:.5px}
  header.top p{margin:0;opacity:.94;font-size:14px}
  header.top a{color:#fff;text-decoration:underline;font-size:13px}
  .hrow{display:flex;align-items:flex-start;gap:10px}
  .hrow h1{flex:1;min-width:0}

  /* ---------- 正在播 ---------- */
  .now{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:24px 20px;margin-bottom:14px;text-align:center}
  .now .tags{margin-bottom:12px}
  .now .grp{font-size:12.5px;color:var(--brand);background:var(--brand-soft);
    border-radius:99px;padding:3px 12px;display:inline-block}

  /* 单元类型：对话 / 短文 / 问答 / 单句 */
  .kind{font-size:11.5px;border-radius:99px;padding:2px 9px;margin-right:6px;
    font-weight:600;white-space:nowrap;display:inline-block;vertical-align:1px;
    background:#eef1f6;color:var(--muted)}
  .kind.k-talk{background:#e8f6ed;color:#15803d}
  .kind.k-text{background:#fff1e7;color:#c2410c}
  .kind.k-qa  {background:#e6f4fd;color:#0369a1}
  .kind.k-one {background:#f3f0fd;color:#6d3fd0}
  .now .en{font-size:24px;line-height:1.6;margin:0;word-break:break-word;font-weight:500}
  .now .cn{font-size:15px;color:var(--muted);margin:8px 0 0}
  .now .idx{font-size:12.5px;color:var(--muted);margin:12px 0 0}
  body.blind .now .en,body.blind .now .cn{filter:blur(9px);user-select:none}
  body.blind .now .en:active,body.blind .now .cn:active{filter:none}
  .seek{height:5px;border-radius:99px;background:#e8ecf2;overflow:hidden;margin-top:14px}
  .seek i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s linear}

  /* ---------- 控制 ---------- */
  .ctrl{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:16px}
  button.rnd{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;
    color:var(--ink);border-radius:99px;width:58px;height:58px;font-size:22px;
    display:flex;align-items:center;justify-content:center;transition:transform .1s}
  button.rnd:active{transform:scale(.93)}
  button.rnd.big{width:76px;height:76px;font-size:30px;
    background:var(--brand);border-color:var(--brand);color:#fff}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:4px 16px;margin-bottom:14px}
  .panel > summary{cursor:pointer;font-weight:600;font-size:15px;padding:11px 0}
  .panel > summary::marker{color:var(--brand)}
  .line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 0}
  .line + .line{border-top:1px dashed var(--line)}
  .line .lb{font-size:14px;color:var(--muted);flex:none;min-width:70px}
  .seg{display:flex;gap:6px;flex-wrap:wrap;flex:1}
  button.sg{font-family:inherit;font-size:13.5px;padding:7px 13px;border-radius:9px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink)}
  button.sg.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .hint{font-size:12.5px;color:var(--muted);line-height:1.7;margin:8px 0 12px}

  /* ---------- 列表 ---------- */
  /* 列表在自己的框里滚，这样播到哪儿都不用翻页，上面的播放区一直看得见 */
  .list{max-height:44vh;overflow-y:auto;overscroll-behavior:contain;
    position:relative;-webkit-overflow-scrolling:touch;
    border-radius:14px;padding-right:2px}
  details.grp{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:2px 16px;margin-bottom:10px}
  details.grp summary{cursor:pointer;font-weight:600;padding:12px 0;font-size:15px}
  details.grp summary::marker{color:var(--brand)}
  ol.tl{margin:0 0 12px;padding:0;list-style:none}
  ol.tl li{padding:9px 10px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1.6;
    border-left:3px solid transparent}
  ol.tl li:hover{background:#f3f5f9}
  ol.tl li.on{background:var(--brand-soft);border-left-color:var(--brand);font-weight:600}
  ol.tl li .c{display:block;font-size:13px;color:var(--muted);font-weight:400}

  .note{background:#fff;border:1px solid var(--line);border-left:4px solid #e9a23b;
    border-radius:12px;padding:16px 18px;font-size:14.5px;line-height:1.9}
  .note code{background:#f3f5f9;border-radius:5px;padding:2px 7px;
    font-family:Consolas,monospace;font-size:13.5px}
  .note b{color:var(--ink)}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:18px 10px 0}

  @media (max-width:640px){
    .wrap{padding:12px 10px 50px}
    header.top{padding:16px 14px;border-radius:12px}
    header.top h1{font-size:20px}
    .now{padding:20px 15px}
    .now .en{font-size:21px}
    button.rnd{width:54px;height:54px;font-size:20px}
    button.rnd.big{width:70px;height:70px;font-size:28px}
    .line .lb{min-width:100%}
  }
</style>
</head>

<script>
/* =====================================================================
   英语熏听 · 播放器
   清单 TRACKS 由 生成熏听音频.py 注入到上面那个 <script> 里，
   所以这个页面不用 fetch 任何东西，本地双击打开也能正常播。
   ===================================================================== */

const KEY = "xun-ting-v1";
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let cfg = {loop:"all", rate:1, gap:0, blind:false, sleep:0, cur:0, setOpen:false};
try{ Object.assign(cfg, JSON.parse(localStorage.getItem(KEY) || "{}")); }catch(e){}
cfg.sleep = 0;               // 定时关闭不跨次保留，每次打开都从「不限」开始
const persist = () => { try{ localStorage.setItem(KEY, JSON.stringify(cfg)); }catch(e){} };

const au = $("au");
let cur = Math.min(cfg.cur || 0, Math.max(0, TRACKS.length - 1));
let playing = false;
let sleepUntil = 0;          // 0 = 不限；否则是该停的时间戳
let gapTimer = null;
let errRun = 0;              // 连续出错次数，防止整串文件都缺时疯狂空转
let lastShown = -1;          // 列表里上次定位到的句子，用来避免重复滚动

/* 按 g 字段把句子切成单元 */
const GROUPS = [];
TRACKS.forEach((t, i) => {
  const last = GROUPS[GROUPS.length - 1];
  if(last && last.name === t.g) last.to = i;
  else GROUPS.push({name:t.g, kind:t.k || "", from:i, to:i});
});
const groupOf = i => GROUPS.find(g => i >= g.from && i <= g.to) || GROUPS[0];

/* 单元类型对应的配色 */
const KIND_CSS = {"对话":"k-talk", "短文":"k-text", "问答":"k-qa", "单句":"k-one"};
const kindTag = k => k ? '<span class="kind ' + (KIND_CSS[k] || "") + '">' + esc(k) + '</span>' : "";

/* ---------------- 没有音频时的说明 ---------------- */
if(!TRACKS.length){
  $("app").innerHTML =
    '<header class="top"><h1>🎧 英语熏听</h1><p>还没有音频</p></header>'
  + '<div class="note">这个页面播的是<b>预先生成好的 mp3</b>，'
  + '这样 iPad 锁屏、切到别的 App 都能继续播（浏览器自带的朗读做不到这点）。<br><br>'
  + '<b>先生成一次音频：</b><br>'
  + '① 装一下工具：<code>pip install edge-tts</code><br>'
  + '② 在这个文件夹里跑：<code>python 生成熏听音频.py</code><br><br>'
  + '脚本会把两份英语练习里的句子还原成完整正确的句子，加上 '
  + '<code>熏听材料.py</code> 里的对话短文，逐句生成 mp3 放进 <code>音频/</code>，'
  + '再把播放清单写回这个页面。<br>'
  + '以后改了题目或材料，重跑一次就行，已经生成过的不会重复生成。'
  + '</div><footer><a href="index.html">← 回导航页</a></footer>';
}else{
  render();
  load(cur, false);
}

/* ---------------- 播放控制 ---------------- */
function load(i, autoplay){
  clearGap();
  cur = (i + TRACKS.length) % TRACKS.length;
  cfg.cur = cur; persist();
  au.src = TRACKS[cur].f;
  au.playbackRate = cfg.rate;
  paint();
  media();
  if(autoplay) start();
}

function start(){
  au.playbackRate = cfg.rate;
  const p = au.play();
  if(p && p.catch) p.catch(()=>{});     // 没有用户手势时会被拒，忽略
  playing = true;
  paint();
}

function pause(){
  clearGap();
  au.pause();
  playing = false;
  paint();
}

// 按钮永远看播放器的真实状态，免得切歌瞬间的事件把 playing 带偏
function toggle(){ (au.paused && !gapTimer) ? start() : pause(); }

function clearGap(){ if(gapTimer){ clearTimeout(gapTimer); gapTimer = null; } }

// auto=true 表示这是一句播完自动续的，单句循环只在这种情况下原地重复
function step(dir, auto){
  if(auto && cfg.loop === "one"){ load(cur, true); return; }
  const g = groupOf(cur);
  let i = cur + dir;
  if(cfg.loop === "group"){
    if(i > g.to) i = g.from;
    if(i < g.from) i = g.to;
  }
  load(i, playing || auto);
}

au.onended = () => {
  if(sleepUntil && Date.now() >= sleepUntil){   // 定时到了就停在这儿
    sleepUntil = 0; cfg.sleep = 0; persist();
    pause(); render();
    return;
  }
  if(cfg.gap > 0){ gapTimer = setTimeout(() => step(1, true), cfg.gap * 1000); }
  else step(1, true);
};
au.onplay  = () => { errRun = 0; playing = true; paint(); };
au.ontimeupdate = () => {
  const bar = $("seek");
  if(bar && au.duration) bar.style.width = (au.currentTime / au.duration * 100) + "%";
};
// 某个 mp3 缺了就跳过下一句；但如果一连串都加载不出来（比如音频目录没传上去），
// 就停下来，不然会一路空转到底
au.onerror = () => {
  if(!playing) return;
  if(++errRun > 5){ pause(); errRun = 0; return; }
  step(1, true);
};

/* 锁屏 / 控制中心里的信息和按钮 */
function media(){
  if(!("mediaSession" in navigator)) return;
  const t = TRACKS[cur];
  try{
    navigator.mediaSession.metadata = new MediaMetadata({
      title: t.t, artist: t.cn || t.g, album: "英语熏听",
    });
    navigator.mediaSession.setActionHandler("play",  () => start());
    navigator.mediaSession.setActionHandler("pause", () => pause());
    navigator.mediaSession.setActionHandler("previoustrack", () => step(-1, false));
    navigator.mediaSession.setActionHandler("nexttrack",     () => step(1, false));
  }catch(e){}
}

/* ---------------- 界面 ---------------- */
function render(){
  const sleepLeft = sleepUntil ? Math.max(0, Math.round((sleepUntil - Date.now())/60000)) : 0;

  $("app").innerHTML =
    '<header class="top"><div class="hrow"><h1>🎧 英语熏听</h1>'
  + '<a href="index.html">← 回导航页</a></div>'
  + '<p>放着磨耳朵就行 · 锁屏和切到别的 App 都会继续播</p></header>'

  + '<div class="now">'
  + '<div class="tags"><span id="kind"></span><span class="grp" id="grp"></span></div>'
  + '<p class="en" id="en"></p>'
  + '<p class="cn" id="cn"></p>'
  + '<p class="idx" id="idx"></p>'
  + '<div class="seek"><i id="seek"></i></div>'
  + '</div>'

  + '<div class="ctrl">'
  + '<button class="rnd" id="bPrev" title="上一句">⏮</button>'
  + '<button class="rnd big" id="bPlay" title="播放 / 暂停">▶</button>'
  + '<button class="rnd" id="bNext" title="下一句">⏭</button>'
  + '</div>'

  + '<details class="panel" id="setBox"' + (cfg.setOpen ? " open" : "") + '>'
  + '<summary>⚙️ 播放设置</summary>'
  + row("循环", "loop", [["all","全部"],["group","本单元"],["one","单句"]])
  + row("语速", "rate", [[0.75,"慢"],[1,"正常"],[1.25,"快"]])
  + row("句间停顿", "gap", [[0,"不停"],[1,"1 秒"],[2,"2 秒"],[3,"3 秒"]])
  + row("定时关闭", "sleep", [[0,"不限"],[15,"15 分"],[30,"30 分"],[60,"60 分"]])
  + row("文字", "blind", [[false,"显示"],[true,"盲听"]])
  + '<p class="hint">盲听模式下文字是糊的，按住能临时看清。'
  + (sleepLeft ? '<br>⏳ 大约 ' + sleepLeft + ' 分钟后停。' : '')
  + '<br>句间停顿设成「不停」时后台播放最稳，设了停顿在锁屏状态下可能不准。</p>'
  + '</details>'

  + '<div class="list" id="list">'
  + GROUPS.map((g, gi) =>
      '<details class="grp" data-g="' + gi + '"><summary>' + kindTag(g.kind) + esc(g.name)
      + ' <span style="color:var(--muted);font-weight:400">· ' + (g.to - g.from + 1) + ' 句</span></summary>'
      + '<ol class="tl">'
      + TRACKS.slice(g.from, g.to + 1).map((t, k) =>
          '<li data-i="' + (g.from + k) + '">' + esc(t.t)
          + (t.cn ? '<span class="c">' + esc(t.cn) + '</span>' : '') + '</li>').join("")
      + '</ol></details>').join("")
  + '</div>'

  + '<footer>共 ' + TRACKS.length + ' 句 · 进度和设置存在这台设备上<br>'
  + '改了题目或材料，重跑 <code>python 生成熏听音频.py</code> 就会更新</footer>';

  $("bPlay").onclick = toggle;
  $("bPrev").onclick = () => step(-1, false);
  $("bNext").onclick = () => step(1, false);

  document.querySelectorAll("button.sg").forEach(b => {
    b.onclick = () => setCfg(b.dataset.k, b.dataset.v);
  });
  document.querySelectorAll("ol.tl li").forEach(li => {
    li.onclick = () => load(+li.dataset.i, true);
  });
  // 记住设置面板是开是合，否则改一个设置后面板就自己收起来了
  $("setBox").ontoggle = () => { cfg.setOpen = $("setBox").open; persist(); };

  lastShown = -1;      // DOM 重建过了，重新定位一次
  paint();
}

function row(label, key, opts){
  return '<div class="line"><span class="lb">' + label + '</span><div class="seg">'
    + opts.map(([v, text]) =>
        '<button class="sg' + (String(cfg[key]) === String(v) ? " on" : "")
        + '" data-k="' + key + '" data-v="' + v + '">' + text + '</button>').join("")
    + '</div></div>';
}

function setCfg(key, raw){
  let v = raw;
  if(raw === "true" || raw === "false") v = (raw === "true");
  else if(!isNaN(parseFloat(raw)) && key !== "loop") v = parseFloat(raw);
  cfg[key] = v;
  persist();

  if(key === "rate") au.playbackRate = v;
  if(key === "sleep") sleepUntil = v ? Date.now() + v * 60000 : 0;
  if(key === "gap" && v === 0) clearGap();
  render();
}

/* 只刷新会变的那几处，不重建整个列表 */
function paint(){
  const t = TRACKS[cur];
  if(!t || !$("en")) return;
  $("kind").innerHTML = kindTag(t.k || "");
  $("grp").textContent = t.g;
  $("en").textContent  = t.t;
  $("cn").textContent  = t.cn || "";
  $("idx").textContent = (cur + 1) + " / " + TRACKS.length;
  $("bPlay").textContent = (!au.paused || gapTimer) ? "⏸" : "▶";
  document.body.classList.toggle("blind", !!cfg.blind);

  document.querySelectorAll("ol.tl li").forEach(li => {
    li.classList.toggle("on", +li.dataset.i === cur);
  });
  if(cur !== lastShown){ lastShown = cur; keepVisible(); }
}

/* 把当前句滚到列表框的中间。
   注意只滚 .list 这个框，不用 scrollIntoView——那个会把整个页面一起滚，
   结果就是播到后面时，上面的「正在播」和播放键被顶出屏幕，得一直往回翻。 */
function keepVisible(){
  const box = $("list");
  if(!box) return;
  const gi = GROUPS.indexOf(groupOf(cur));
  const d = box.querySelector('details.grp[data-g="' + gi + '"]');
  if(d && !d.open) d.open = true;        // 单元没展开的话，滚过去也看不见
  const on = box.querySelector("ol.tl li.on");
  if(!on) return;
  const top = on.offsetTop - (box.clientHeight - on.offsetHeight) / 2;
  box.scrollTo({top: Math.max(0, top), behavior: "smooth"});
}
</script>
