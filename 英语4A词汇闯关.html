<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4A 词汇闯关 · 英语预习单</title>
<link rel="icon" href="favicon.svg?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<style>
  :root{
    --bg:#f5f7fc; --card:#fff; --ink:#1f2430; --muted:#6b7280; --line:#e5e7eb;
    --brand:#2f6df0; --brand-soft:#eaf0ff; --ok:#15803d; --ok-soft:#e6f6ec;
    --no:#c2410c; --no-soft:#fdeee6; --gold:#e8a317;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);line-height:1.6;-webkit-text-size-adjust:100%;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    padding:0 0 env(safe-area-inset-bottom)}
  .wrap{max-width:720px;margin:0 auto;padding:18px 14px 40px}

  header.top{background:linear-gradient(135deg,#2f6df0,#6aa0ff);color:#fff;
    border-radius:16px;padding:18px 20px;margin-bottom:16px}
  header.top h1{margin:0 0 4px;font-size:22px}
  header.top p{margin:0;opacity:.93;font-size:13.5px}
  header.top a{color:#fff}
  .allbar{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:13px;
    background:rgba(255,255,255,.18);border-radius:10px;padding:7px 12px}
  .allbar .bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}
  .allbar .bar i{display:block;height:100%;width:0;background:#fff;transition:width .4s}
  .duetip{margin-top:8px;font-size:13px;opacity:.95}

  .panel{display:none}
  .panel.on{display:block}

  /* ---- 选单元 ---- */
  .units{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .unit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
    cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .08s,box-shadow .15s}
  .unit:active{transform:scale(.98)}
  .unit h3{margin:0 0 2px;font-size:16px}
  .unit .sub{font-size:12.5px;color:var(--muted)}
  .unit .bar{height:7px;border-radius:99px;background:#eef1f6;overflow:hidden;margin-top:8px}
  .unit .bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .4s}
  .unit.done{border-color:#bfe6cd;background:var(--ok-soft)}
  .unit.done .bar i{background:var(--ok)}
  .unit .crown{float:right;font-size:17px}
  .wrongbtn{margin-top:12px;width:100%;background:var(--card);border:1px dashed #f0b8a0;color:var(--no);
    border-radius:14px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
  .wrongbtn[disabled]{opacity:.5;cursor:default;border-style:solid;border-color:var(--line);color:var(--muted)}

  /* ---- 答题 ---- */
  .qhead{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);margin-bottom:10px}
  .qhead .bar{flex:1;height:7px;border-radius:99px;background:#e7ebf3;overflow:hidden}
  .qhead .bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .3s}
  .combo{color:var(--gold);font-weight:700}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:22px 18px;text-align:center;box-shadow:0 2px 14px rgba(31,36,48,.05)}
  .tag{display:inline-block;font-size:12px;color:var(--brand);background:var(--brand-soft);
    border-radius:99px;padding:3px 12px;margin-bottom:12px}
  .ask{font-size:30px;font-weight:700;line-height:1.35;word-break:break-word;margin:4px 0 6px}
  .ask.cn{font-size:26px}
  .hint{font-size:14px;color:var(--muted);min-height:22px}
  .speak{margin-top:10px;background:var(--brand-soft);border:none;border-radius:99px;
    font:inherit;font-size:15px;color:var(--brand);padding:9px 20px;cursor:pointer}
  .speak:active{transform:scale(.97)}

  .opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
  .opts button{font:inherit;font-size:17px;padding:16px 10px;border-radius:14px;
    border:2px solid var(--line);background:var(--card);cursor:pointer;min-height:62px;
    word-break:break-word;transition:transform .08s}
  .opts button:active{transform:scale(.97)}
  .opts button.right{border-color:#8fd2a8;background:var(--ok-soft);color:var(--ok)}
  .opts button.wrong{border-color:#f0b8a0;background:var(--no-soft);color:var(--no)}
  .opts button[disabled]{cursor:default}
  @media (max-width:360px){ .opts{grid-template-columns:1fr} }

  /* 拼写题 */
  .slots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px;min-height:52px}
  .slot{width:38px;height:48px;border-bottom:3px solid var(--line);font-size:26px;font-weight:700;
    display:flex;align-items:center;justify-content:center;color:var(--brand)}
  .slot.filled{border-color:var(--brand)}
  .tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
  .tiles button{font:inherit;font-size:22px;font-weight:700;width:46px;height:52px;border-radius:12px;
    border:2px solid var(--line);background:var(--card);cursor:pointer}
  .tiles button:active{transform:scale(.94)}
  .tiles button.used{opacity:.25;cursor:default}
  .spellbtns{display:flex;gap:10px;justify-content:center;margin-top:14px}
  .spellbtns button{font:inherit;font-size:15px;padding:10px 20px;border-radius:99px;border:1px solid var(--line);
    background:var(--card);cursor:pointer}
  .spellbtns .go{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  .spellbtns .go[disabled]{opacity:.4}

  .say{margin-top:14px;font-size:15px;min-height:46px;color:var(--muted)}
  .say b{color:var(--ink)}
  .say.good{color:var(--ok)}
  .say.bad{color:var(--no)}

  .next{margin-top:14px;width:100%;font:inherit;font-size:17px;font-weight:600;padding:14px;
    border-radius:14px;border:none;background:var(--brand);color:#fff;cursor:pointer;display:none}
  .next.on{display:block}

  /* 夸奖特效 */
  #praise{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;z-index:50;
    font-size:40px;font-weight:800;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.08);
    opacity:0;transform:scale(.6)}
  #praise.pop{animation:pop 1.1s ease-out}
  @keyframes pop{
    0%{opacity:0;transform:scale(.6)}
    18%{opacity:1;transform:scale(1.12)}
    32%{transform:scale(1)}
    100%{opacity:0;transform:scale(1.05) translateY(-26px)}
  }
  @media (prefers-reduced-motion:reduce){ #praise.pop{animation:none} }

  /* ---- 结算 ---- */
  .result{text-align:center}
  .stars{font-size:46px;letter-spacing:6px;color:var(--gold)}
  .stars span.off{color:#dfe3ea}
  .nums{font-size:15px;color:var(--muted);line-height:2.1;margin-top:6px}
  .nums em{font-style:normal;color:var(--ink);font-weight:700;font-size:17px}
  .rbtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
  .rbtns button{font:inherit;font-size:16px;font-weight:600;padding:13px 24px;border-radius:99px;
    border:none;background:var(--brand);color:#fff;cursor:pointer}
  .rbtns button.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink);font-weight:500}
  .review{text-align:left;margin-top:16px;font-size:14.5px}
  .review h4{margin:0 0 6px;font-size:14px;color:var(--no)}
  .review div{padding:6px 0;border-bottom:1px dashed var(--line)}
  .review b{color:var(--ink)}

  .back{display:inline-block;margin-top:18px;font-size:14px;color:var(--muted);text-decoration:none}

  /* 收藏到生词本的星星。放在卡片右上角，答题中随时能点，
     点完立刻变实心——小朋友要的是「我刚刚做了件事」的即时反馈。 */
  .card{position:relative}
  .star{position:absolute;right:10px;top:8px;border:none;background:transparent;cursor:pointer;
    font-size:24px;line-height:1;padding:6px 8px;color:#cfd5e0;transition:transform .12s}
  .star.on{color:var(--gold)}
  .star:active{transform:scale(1.25)}
  .startip{position:absolute;right:8px;top:44px;font-size:12px;color:var(--muted);opacity:0;
    transition:opacity .25s;pointer-events:none}
  .startip.show{opacity:1}

  /* 两个本子 + 管理 */
  .books{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .books button{font:inherit;font-weight:600;padding:12px 10px;border-radius:14px;cursor:pointer;
    background:var(--card);border:1px solid var(--line);color:var(--ink);text-align:left;line-height:1.45}
  .books button .s{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
  .books button[disabled]{opacity:.55;cursor:default}
  .books .starbook{border-color:#f0d79a}
  .books .wrongbook{border-color:#f0c3ad}
  .playbook{width:100%;margin-bottom:10px;font:inherit;font-size:16px;font-weight:600;padding:13px;
    border-radius:14px;border:none;background:var(--brand);color:#fff;cursor:pointer}
  .playbook[disabled]{background:#cfd6e4;cursor:default}
  @media (max-width:360px){ .books{grid-template-columns:1fr} }

  /* 管理面板 */
  .mlist{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .mrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
  .mrow:last-child{border-bottom:none}
  .mrow .w{flex:1;min-width:0}
  .mrow .w b{display:block;font-size:16px}
  .mrow .w span{font-size:13px;color:var(--muted)}
  .mrow button{font:inherit;font-size:13px;padding:7px 12px;border-radius:99px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--muted);white-space:nowrap}
  .mrow button.known{border-color:#8fd2a8;color:var(--ok)}
  .mrow button.waiting{border-style:dashed;color:var(--muted);opacity:.9}
  .chips{margin-top:5px;display:flex;gap:5px}
  .chip{font-style:normal;font-size:11.5px;line-height:1;padding:4px 7px;border-radius:99px;
    background:#f1f3f8;color:var(--muted)}
  .chip.got{background:var(--ok-soft);color:var(--ok)}
  .mempty{padding:22px 14px;text-align:center;color:var(--muted);font-size:14px}
  .mtabs{display:flex;gap:8px;margin-bottom:12px}
  .mtabs button{flex:1;font:inherit;font-size:15px;padding:10px;border-radius:99px;cursor:pointer;
    border:1px solid var(--line);background:var(--card);color:var(--muted)}
  .mtabs button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <h1>🔤 4A 词汇闯关</h1>
  <p>按预习单来的 220 个单词词组 · 认一认 → 听一听 → 想一想 → 拼一拼</p>
  <div class="allbar"><span id="alltext">熟练度 0%</span>
    <span class="bar"><i id="allbar"></i></span></div>
  <div class="duetip" id="duetip"></div>
</header>

<!-- 选单元 -->
<div class="panel on" id="phome">
  <div class="units" id="units"></div>
  <div class="books">
    <button class="starbook" id="starbtn"></button>
    <button class="wrongbook" id="wrongbtn"></button>
  </div>
  <a class="back" href="index.html">← 回导航页</a>
</div>

<!-- 本子：打开就是列表，上面一条「练这一本」 -->
<div class="panel" id="pbook">
  <div class="mtabs">
    <button id="tabstar" class="on">⭐ 生词本</button>
    <button id="tabwrong">📕 错词本</button>
  </div>
  <button class="playbook" id="playbook"></button>
  <div class="mlist" id="mlist"></div>
  <a class="back" href="#" id="bookback">← 回选单元</a>
</div>

<!-- 答题 -->
<div class="panel" id="pplay">
  <div class="qhead">
    <span id="qwhere">Unit 1</span>
    <span class="bar"><i id="qbar"></i></span>
    <span id="qnum">1 / 10</span>
    <span class="combo" id="qcombo"></span>
  </div>
  <div class="card">
    <button class="star" id="qstar" title="收进生词本">☆</button>
    <span class="startip" id="qstartip"></span>
    <span class="tag" id="qtag">认一认</span>
    <div class="ask" id="qask"></div>
    <div class="hint" id="qhint"></div>
    <button class="speak" id="qspeak">🔊 再读一遍</button>

    <div class="opts" id="qopts"></div>

    <div id="qspell" style="display:none">
      <div class="slots" id="qslots"></div>
      <div class="tiles" id="qtiles"></div>
      <div class="spellbtns">
        <button id="qclear">清空</button>
        <button class="go" id="qgo" disabled>确定</button>
      </div>
    </div>

    <div class="say" id="qsay"></div>
    <button class="next" id="qnext">下一题 →</button>
  </div>
  <a class="back" href="#" id="quit">← 退出这一关</a>
</div>

<!-- 结算 -->
<div class="panel" id="pover">
  <div class="card result">
    <div class="stars" id="ostars"></div>
    <h2 id="otitle" style="margin:6px 0 0;font-size:21px"></h2>
    <div class="nums" id="onums"></div>
    <div class="review" id="oreview"></div>
    <div class="rbtns">
      <button id="oagain">再来一关</button>
      <button class="ghost" id="oback">换个单元</button>
    </div>
  </div>
</div>

</div>
<div id="praise"></div>

<script src="英语4A词库.js?v=202611231737"></script>
<script src="词汇逻辑.js?v=202611231737"></script>
<script>
(function () {
  "use strict";
  var DB = window.词库4A, L = window.词汇逻辑;
  var KEY = "en4a-vocab-v1";

  var $ = function (id) { return document.getElementById(id); };
  var ALL = DB.all();

  /* ---------------- 进度读写 ----------------
     只存一个 key，内容是 {id: {lv,due,ok,no}}。同步.js 盯着这个 key，
     所以每次写都要走 save()，不要直接改 localStorage。 */
  var prog = load();
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; }
    catch (e) { return {}; }
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {}
  }
  // 另一台设备同步回来之后，重画一下首页的进度
  window.addEventListener("storage", function (e) {
    if (e.key !== KEY) return;
    prog = load();
    if ($("phome").classList.contains("on")) renderHome();
  });

  /* ---------------- 朗读 ----------------
     iOS 要用户手势才肯出声，所以第一次点击时先空放一句解锁；
     另外 iOS 上连着调 speak 会卡住，统一先 cancel 再延时一点点。

     声音优先挑英语女声——小朋友更听得进去，也跟两个小游戏里的夸奖声一致。
     挑不到女声就退而求其次用 en-US，但绝不拿中文声去念英文。 */
  var voiceEn = null, unlocked = false;
  function pickVoice() {
    var vs = speechSynthesis.getVoices() || [];
    var en = vs.filter(function (v) { return /^en/i.test(v.lang || ""); });
    var female = en.filter(function (v) {
      return /samantha|karen|zira|aria|jenny|moira|tessa|victoria|serena|fiona|catherine|susan|female|woman/i.test(v.name || "");
    });
    var us = en.filter(function (v) { return /^en[-_]US/i.test(v.lang || ""); });
    voiceEn = female[0] || us[0] || en[0] || null;
  }
  if (window.speechSynthesis) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }
  function speak(text, rate) {
    if (!window.speechSynthesis || !text) return;
    try {
      speechSynthesis.cancel();
      setTimeout(function () {
        var u = new SpeechSynthesisUtterance(text);
        u.lang = "en-US"; u.rate = rate || .85;
        if (voiceEn) u.voice = voiceEn;
        speechSynthesis.speak(u);
      }, 60);
    } catch (e) {}
  }
  function unlock() {
    if (unlocked || !window.speechSynthesis) return;
    unlocked = true;
    try {
      var u = new SpeechSynthesisUtterance(" ");
      u.volume = 0; speechSynthesis.speak(u);
    } catch (e) {}
  }
  document.addEventListener("touchstart", unlock, { once: true });
  document.addEventListener("click", unlock, { once: true });

  /* 夸奖：同一句不连着出现，免得像复读机 */
  var PRAISE = ["Great job!", "Well done!", "Excellent!", "Perfect!", "Awesome!",
                "You got it!", "Nice work!", "Brilliant!", "Super!", "Amazing!",
                "Keep going!", "That's right!"];
  var lastPraise = "";
  function praise() {
    var pool = PRAISE.filter(function (p) { return p !== lastPraise; });
    var t = pool[Math.floor(Math.random() * pool.length)];
    lastPraise = t;
    var el = $("praise");
    el.textContent = t;
    el.classList.remove("pop");
    void el.offsetWidth;            // 重启动画
    el.classList.add("pop");
    return t;
  }

  /* ---------------- 首页 ---------------- */
  function renderHome() {
    var box = $("units");
    box.innerHTML = "";
    DB.UNITS.forEach(function (u) {
      var pool = DB.unit(u.u);
      var s = L.unitStat(pool, prog);
      var b = document.createElement("button");
      b.className = "unit" + (s.pct === 100 ? " done" : "");
      b.innerHTML =
        '<span class="crown">' + (s.pct === 100 ? "👑" : s.pct >= 50 ? "🌟" : "") + '</span>' +
        '<h3>Unit ' + u.u + '</h3>' +
        '<div class="sub">' + esc(u.title) + ' · ' + s.total + ' 词</div>' +
        '<div class="bar"><i style="width:' + s.pct + '%"></i></div>' +
        '<div class="sub" style="margin-top:4px">熟练度 ' + s.pct + '% · 练熟 ' + s.mastered + ' / ' + s.total + '</div>';
      b.onclick = function () { start(pool, "Unit " + u.u); };
      box.appendChild(b);
    });

    var all = L.unitStat(ALL, prog);
    $("alltext").textContent = "熟练度 " + all.pct + "% · 练熟 " + all.mastered + " / " + all.total;
    $("allbar").style.width = all.pct + "%";

    /* 复习是按时间排的，练完一轮再点进来经常「没到点」。
       与其让人对着不动的进度条犯嘀咕，不如直接把下一批什么时候来写出来。 */
    var d = L.dueInfo(ALL, prog, Date.now());
    $("duetip").textContent =
      d.ready ? "⏰ 现在有 " + d.ready + " 个词到点该复习了" :
      d.fresh ? "🌱 还有 " + d.fresh + " 个新词没学过，挑个 unit 开始吧" :
      d.wait === null ? "🎉 所有词都练熟了！" :
      "😴 这一轮都复习过了，下一批 " + waitText(d.wait) + "后再来";

    /* 首页上两个本子就是入口，点进去是「本子」那一页：
       上面一条「练这一本」，下面是列表。原来还额外挂了个「管理」按钮，
       点开是同一页，白白多一道门。 */
    var weak = L.weak(ALL, prog);
    var wb = $("wrongbtn");
    wb.innerHTML = "📕 错词本 · " + weak.length + " 个" +
      '<span class="s">' + (weak.length ? "练一练，或者测一测把词划掉" : "还没有错词，先去闯几关") + "</span>";
    wb.onclick = function () { tab = "wrong"; renderBook(); show("pbook"); };

    // 生词本：自己点星星收进来的，想重点练哪个就练哪个
    var star = L.starred(ALL, prog);
    var sb = $("starbtn");
    sb.innerHTML = "⭐ 生词本 · " + star.length + " 个" +
      '<span class="s">' + (star.length ? "只练你标记过的词" : "答题时点右上角☆收进来") + "</span>";
    sb.onclick = function () { tab = "star"; renderBook(); show("pbook"); };
  }

  /* 结算页解释一句「为什么还没练熟」：
     前几级排得很密，今天多打几关就能把词推到第 3 级；
     但最后一级要隔一天——隔夜还记得才算真记住。 */
  function levelTip() {
    var d = L.dueInfo(pool, prog, Date.now());
    if (d.ready) return "还有 " + d.ready + " 个词现在就能再练一遍，接着来";
    if (d.fresh) return "这一关的词先放一放，还有 " + d.fresh + " 个新词没见过";
    if (d.wait === null) return "这些词都练熟了，明天换一关吧";
    return "刚练过的词要缓 " + waitText(d.wait) + "才再问 · 最后一级要隔一天，隔夜还记得才算练熟";
  }

  function waitText(ms) {
    var m = Math.ceil(ms / 60000);
    if (m < 60) return m + " 分钟";
    var h = Math.round(m / 60);
    return h < 24 ? h + " 小时" : Math.round(h / 24) + " 天";
  }

  function esc(s) {    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function show(id) {
    ["phome", "pplay", "pover", "pbook"].forEach(function (p) {
      $(p).classList.toggle("on", p === id);
    });
    window.scrollTo(0, 0);
  }

  /* ---------------- 管理两个本子 ----------------
     本来每行给了「已掌握」和「移除」两个按钮，其实是一件事：
     「已掌握」顺手也把词从本子里拿走，「移除」做的也是同一步，
     差别只在要不要顺带把练习进度拔到掌握线——那是假装练过，
     数据反而不准了。所以只留一个「移除」：把词从这个本子里拿走，
     练习进度一个字都不动，想再练就回 unit 里正常练。 */
  var tab = "star";
  // 四种问法的小名，错词本上用它显示「还差哪几关」
  var MODE_CN = { en2cn: "认", listen: "听", cn2en: "想", spell: "拼" };
  function renderBook() {
    $("tabstar").classList.toggle("on", tab === "star");
    $("tabwrong").classList.toggle("on", tab === "wrong");
    var list = tab === "star" ? L.starred(ALL, prog) : L.weak(ALL, prog);
    var play = $("playbook");
    play.disabled = list.length === 0;
    play.textContent = list.length
      ? "▶ 练这一本（" + list.length + " 个词）"
      : "▶ 这一本是空的";
    play.onclick = function () {
      if (list.length) start(list, tab === "star" ? "生词本" : "错词本");
    };
    var box = $("mlist");
    box.innerHTML = "";
    if (!list.length) {
      box.innerHTML = '<div class="mempty">' +
        (tab === "star" ? "生词本是空的。答题时点卡片右上角的 ☆，就把这个词收进来了。"
                        : "错词本是空的——说明最近没答错，挺好。") + "</div>";
      return;
    }
    list.forEach(function (x) {
      var row = document.createElement("div");
      row.className = "mrow";
      var modes = L.modesOf(x), left = L.modesLeft(x, prog);
      var chips = modes.map(function (m) {
        var got = left.indexOf(m) < 0;
        return '<i class="chip' + (got ? " got" : "") + '">' +
               (got ? "✓" : "") + MODE_CN[m] + "</i>";
      }).join("");

      row.innerHTML =
        '<div class="w"><b>' + esc(x.w) + '</b>' +
        '<span>' + esc(x.p ? x.p + " " : "") + esc(x.c) + ' · Unit ' + x.unit + '</span>' +
        (tab === "wrong" ? '<div class="chips">' + chips + '</div>' : '') + '</div>';

      var out = document.createElement("button");
      if (tab === "star") {
        out.className = "known";
        out.textContent = "✓ 移出生词本";
        out.onclick = function () {
          L.star(prog, x.id, false);
          save(); renderBook(); renderHome();
        };
      } else {
        /* 要把词移出错词本，得在这儿当场连考它的每一种问法。
           平时练习里蒙对一次不算——那正是错词本想拦住的情况。 */
        out.className = "known";
        out.textContent = "🎓 测一测，过了就移除";
        out.onclick = function () { startChallenge(x); };
      }

      row.appendChild(out);
      box.appendChild(row);
    });
  }
  $("tabstar").onclick = function () { tab = "star"; renderBook(); };
  $("tabwrong").onclick = function () { tab = "wrong"; renderBook(); };
  $("bookback").onclick = function (e) { e.preventDefault(); renderHome(); show("phome"); };

  /* 答题中的星星 */
  function paintStar() {
    var on = Q && L.isStarred(prog, Q.item.id);
    var b = $("qstar");
    b.textContent = on ? "★" : "☆";
    b.classList.toggle("on", !!on);
    b.title = on ? "已在生词本，点一下移出" : "收进生词本";
  }
  $("qstar").onclick = function () {
    if (!Q) return;
    var on = L.star(prog, Q.item.id, !L.isStarred(prog, Q.item.id));
    save();
    paintStar();
    var tip = $("qstartip");
    tip.textContent = on ? "已收进生词本" : "已移出生词本";
    tip.classList.add("show");
    clearTimeout(tip._t);
    tip._t = setTimeout(function () { tip.classList.remove("show"); }, 1400);
  };

  /* ---------------- 一关 ---------------- */
  var R = null, Q = null, pool = null, where = "", answered = false, picked = [];

  /* 错词本的「过关测试」：当场把这一个词的四种问法连考一遍。
     全对才把它从错词本里划掉，中间错一次就算没过——
     平时练习顺手蒙对不算数，要移除就得在这儿证明一次。 */
  var CH = null;   // { item, modes, i, failed }

  function startChallenge(item) {
    CH = { item: item, modes: L.modesOf(item), i: 0, failed: false };
    pool = [item]; where = "过关测试"; R = null;
    $("qwhere").textContent = "过关测试 · " + item.w;
    show("pplay");
    nextQ();
  }

  function start(p, name) {
    CH = null;
    pool = p; where = name;
    R = L.newRound(pool, prog, Date.now(), Math.random, ALL);
    $("qwhere").textContent = name;
    show("pplay");
    nextQ();
  }

  function nextQ() {
    if (CH) {
      if (CH.i >= CH.modes.length) return challengeOver();
      Q = L.makeQuestion(CH.item, ALL, prog, Math.random, ALL, CH.modes[CH.i]);
      CH.i++;
      answered = false; picked = [];
      render();
      return;
    }
    var item = L.nextItem(R);
    if (!item) return over();
    /* 错词本平时也按「还差哪几种问法」来出题，
       但真正把它移出本子要靠上面的过关测试。 */
    var force = null;
    if (where === "错词本") {
      var left = L.modesLeft(item, prog);
      force = left[0] || null;
    }
    Q = L.makeQuestion(item, pool, prog, Math.random, ALL, force);
    answered = false;
    picked = [];
    render();
  }

  var TAG = { en2cn: "认一认 · 这个词什么意思", listen: "听一听 · 听到的是哪个意思",
              cn2en: "想一想 · 中文对应哪个英文", spell: "拼一拼 · 把字母排好" };

  function render() {
    var done = CH ? CH.i - 1 : R.right + R.wrong;
    var total = CH ? CH.modes.length : R.total;
    $("qnum").textContent = (done + 1) + " / " + total;
    $("qbar").style.width = Math.min(100, done / total * 100) + "%";
    $("qcombo").textContent = CH ? (CH.failed ? "这次没过" : "全对才算过")
                                 : (R.combo >= 3 ? "🔥 连对 " + R.combo : "");
    $("qtag").textContent = TAG[Q.kind];
    $("qsay").textContent = "";
    $("qsay").className = "say";
    $("qstartip").classList.remove("show");
    paintStar();
    $("qnext").classList.remove("on");

    var ask = $("qask");
    ask.className = "ask" + (Q.kind === "cn2en" || Q.kind === "spell" ? " cn" : "");
    ask.textContent = Q.kind === "listen" ? "🎧" : Q.ask;
    $("qhint").textContent =
      Q.kind === "spell" ? Q.hint :
      Q.kind === "listen" ? "点下面的喇叭，听清楚再选" :
      Q.item.p || "";

    $("qspeak").style.display = Q.kind === "cn2en" ? "none" : "";
    $("qspeak").textContent = Q.kind === "listen" ? "🔊 播放" : "🔊 再读一遍";

    if (Q.kind === "spell") {
      $("qopts").style.display = "none";
      $("qspell").style.display = "";
      renderSpell();
    } else {
      $("qspell").style.display = "none";
      $("qopts").style.display = "";
      renderOpts();
    }

    // 看得见英文的题，顺手读一遍；听力题也直接播，省一次点击
    if (Q.kind === "en2cn" || Q.kind === "listen") speak(Q.speak);
  }

  function renderOpts() {
    var box = $("qopts");
    box.innerHTML = "";
    Q.choices.forEach(function (c) {
      var b = document.createElement("button");
      b.textContent = c;
      b.onclick = function () { choose(b, c); };
      box.appendChild(b);
    });
  }

  /* 判一题。过关测试不走 round 的那套统计，但一样要把成绩记进进度表，
     这样「这种问法会了」才算数。 */
  function judge(ans) {
    if (!CH) return L.answer(R, Q, ans, prog, Date.now());
    var right = L.check(Q, ans);
    L.grade(prog, Q.item.id, right, Date.now(), Q.kind);
    if (!right) CH.failed = true;
    return right;
  }

  function choose(btn, c) {
    if (answered) return;
    answered = true;
    var right = judge(c);
    save();
    [].forEach.call($("qopts").children, function (b) {
      b.disabled = true;
      if (b.textContent === Q.answer) b.classList.add("right");
    });
    if (!right) btn.classList.add("wrong");
    feedback(right);
  }

  /* ---- 拼写题 ---- */
  function renderSpell() {
    var slots = $("qslots"), tiles = $("qtiles");
    slots.innerHTML = ""; tiles.innerHTML = "";
    for (var i = 0; i < Q.answer.length; i++) {
      var s = document.createElement("div");
      s.className = "slot";
      slots.appendChild(s);
    }
    Q.tiles.forEach(function (ch, i) {
      var b = document.createElement("button");
      b.textContent = ch;
      b.onclick = function () { putTile(i, ch, b); };
      tiles.appendChild(b);
    });
    $("qgo").disabled = true;
    $("qclear").onclick = clearSpell;
    $("qgo").onclick = submitSpell;
  }

  function putTile(i, ch, btn) {
    if (answered || btn.classList.contains("used")) return;
    btn.classList.add("used");
    picked.push({ i: i, ch: ch, btn: btn });
    paintSlots();
  }
  function clearSpell() {
    if (answered) return;
    picked.forEach(function (p) { p.btn.classList.remove("used"); });
    picked = [];
    paintSlots();
  }
  function paintSlots() {
    var slots = $("qslots").children;
    for (var i = 0; i < slots.length; i++) {
      slots[i].textContent = picked[i] ? picked[i].ch : "";
      slots[i].classList.toggle("filled", !!picked[i]);
    }
    $("qgo").disabled = picked.length !== Q.answer.length;
  }
  function submitSpell() {
    if (answered || picked.length !== Q.answer.length) return;
    answered = true;
    var word = picked.map(function (p) { return p.ch; }).join("");
    var right = judge(word);
    save();
    [].forEach.call($("qslots").children, function (s) {
      s.style.color = right ? "var(--ok)" : "var(--no)";
      s.style.borderColor = right ? "var(--ok)" : "var(--no)";
    });
    feedback(right);
  }

  /* ---- 对错反馈 ---- */
  function feedback(right) {
    var say = $("qsay");
    if (right) {
      var t = praise();
      say.className = "say good";
      say.innerHTML = "✅ " + esc(t) + "　<b>" + esc(Q.item.w) + "</b> " + esc(Q.item.c);
      speak(Q.item.w + ". " + t);
    } else {
      say.className = "say bad";
      say.innerHTML = "再记一次：<b>" + esc(Q.item.w) + "</b> " + esc(Q.item.c) +
                      "<br><span style='font-size:13px'>" +
                      (CH ? "这次测试没过，它还留在错词本里" : "等会儿它还会再来一次") +
                      "</span>";
      speak(Q.item.w, .75);
    }
    $("qnext").classList.add("on");
    $("qnext").textContent = CH
      ? (CH.i < CH.modes.length ? "下一种问法 →" : "看结果 →")
      : (R.again.length || R.i < R.queue.length ? "下一题 →" : "看结果 →");
  }

  /* 从哪儿来就回哪儿去：从本子里开的关，退出该回本子，不是回选单元页 */
  function fromBook() { return where === "生词本" || where === "错词本"; }
  function goBack() {
    if (fromBook()) {
      tab = where === "生词本" ? "star" : "wrong";
      renderBook(); show("pbook");
    } else {
      renderHome(); show("phome");
    }
  }

  $("qnext").onclick = nextQ;
  $("qspeak").onclick = function () { speak(Q && Q.speak, Q && Q.kind === "listen" ? .75 : .85); };
  $("quit").onclick = function (e) {
    e.preventDefault();
    if (CH) {
      if (CH.i > 1 && !confirm("测试还没做完，现在退出就算没过。确定吗？")) return;
      CH = null; tab = "wrong"; renderBook(); show("pbook"); return;
    }
    if (R.right + R.wrong > 0 && !confirm("这一关还没打完，确定退出吗？已经答过的都算数。")) return;
    goBack();
  };

  /* ---------------- 结算 ---------------- */
  function over() {
    $("oagain").textContent = "再来一关";
    $("oback").textContent = fromBook() ? "回" + where : "换个单元";
    var n = L.stars(R);
    $("ostars").innerHTML = [0, 1, 2].map(function (i) {
      return i < n ? "★" : '<span class="off">★</span>';
    }).join("");
    $("otitle").textContent = n === 3 ? "全对！这一关拿下了" : n >= 1 ? "这一关过了" : "再来一遍会更稳";
    var s = L.unitStat(pool, prog);
    $("onums").innerHTML =
      "答对 <em>" + R.right + "</em> 题　答错 <em>" + R.wrong + "</em> 题<br>" +
      "最长连对 <em>" + R.best + "</em> 题<br>" +
      esc(where) + " 熟练度 <em>" + s.pct + "%</em>　练熟 <em>" + s.mastered + "</em> / " + s.total +
      '<br><span style="font-size:13px">' + levelTip() + '</span>';

    var missed = {};
    (R.queue || []).forEach(function (x) {
      var r = L.recOf(prog, x.id);
      if (r.no > 0 && r.lv < L.MASTER_LEVEL) missed[x.id] = x;
    });
    var list = Object.keys(missed).map(function (k) { return missed[k]; }).slice(0, 8);
    $("oreview").innerHTML = list.length
      ? "<h4>这几个还得再看看</h4>" + list.map(function (x) {
          return "<div><b>" + esc(x.w) + "</b> " + esc(x.p ? x.p + " " : "") + esc(x.c) + "</div>";
        }).join("")
      : "";
    show("pover");
  }

  /* 过关测试的结算：全对才真的把词从错词本里划掉 */
  function challengeOver() {
    var item = CH.item, passed = !CH.failed;
    if (passed) L.clearWrong(prog, item.id);
    save();
    $("ostars").innerHTML = passed ? "🎓" : "💪";
    $("otitle").textContent = passed ? "过关！这个词从错词本里划掉了" : "还差一点，它继续留在错词本";
    $("onums").innerHTML =
      "<em>" + esc(item.w) + "</em> " + esc(item.c) + "<br>" +
      CH.modes.map(function (m) { return MODE_CN[m]; }).join(" · ") +
      " 共 " + CH.modes.length + " 关<br>" +
      '<span style="font-size:13px">' +
      (passed ? "四种问法一次过，这才算真会了" : "测试里只要错一次就不算过，缓一缓再来") +
      "</span>";
    $("oreview").innerHTML = "";
    $("oagain").textContent = passed ? "再测一个" : "再测一次";
    $("oback").textContent = "回错词本";
    show("pover");
  }

  $("oagain").onclick = function () {
    if (CH) {
      var item = CH.item;
      if (CH.failed) return startChallenge(item);   // 没过就重考这一个
      CH = null; tab = "wrong"; renderBook(); show("pbook"); return;  // 过了就回去挑下一个
    }
    start(pool, where);
  };
  $("oback").onclick = function () {
    $("oagain").textContent = "再来一关";
    $("oback").textContent = "换个单元";
    if (CH) { CH = null; tab = "wrong"; renderBook(); show("pbook"); return; }
    goBack();
  };

  renderHome();
})();
</script>
