<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>学习闯关 · 快问快答</title>
<link rel="icon" href="favicon.svg?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<style>
  :root{
    --bg:#f6f7fb; --card:#fff; --ink:#1f2430; --muted:#6b7280;
    --line:#e5e7eb; --brand:#ea580c; --brand-soft:#fff1e7;
    --ok:#15803d; --ok-soft:#e8f6ed; --ok-line:#86d7a5;
    --no:#c2410c; --no-soft:#fdeee6; --no-line:#f0b48e;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);line-height:1.65;
    -webkit-text-size-adjust:100%;text-size-adjust:100%;
    -webkit-tap-highlight-color:transparent;
    font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px}

  /* ---------- 顶部 ---------- */
  header.top{background:linear-gradient(135deg,#f97316,#fb7185);color:#fff;
    border-radius:16px;padding:20px 22px;margin-bottom:18px}
  header.top h1{margin:0 0 6px;font-size:23px;letter-spacing:.5px}
  header.top p{margin:0;opacity:.94;font-size:14px}
  header.top a{color:#fff;text-decoration:underline}
  .hrow{display:flex;align-items:flex-start;gap:10px}
  .hrow h1{flex:1;min-width:0}
  button.quit{font-family:inherit;font-size:13px;padding:6px 12px;border-radius:99px;cursor:pointer;
    border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);color:#fff;
    white-space:nowrap;flex:none}
  .toprow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}
  .tgl{font-family:inherit;font-size:13px;padding:6px 12px;border-radius:99px;cursor:pointer;
    border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.16);color:#fff}
  .tgl.off{opacity:.55}

  /* ---------- 课程 / 关卡 ---------- */
  h2.g{font-size:15px;color:var(--muted);margin:24px 0 10px;font-weight:600}
  .levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  button.lv{display:block;width:100%;text-align:left;font-family:inherit;cursor:pointer;
    background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,#999);
    border-radius:13px;padding:13px 15px;color:inherit;transition:transform .15s,box-shadow .15s}
  button.lv:disabled{cursor:not-allowed;opacity:.55;background:#f3f4f6}
  button.lv .t{font-size:16px;font-weight:600;margin-bottom:3px}
  button.lv .d{font-size:12.5px;color:var(--muted);line-height:1.6}
  button.lv .st{font-size:15px;letter-spacing:2px;margin-top:5px;color:#f0a500}
  button.lv .lock{font-size:12.5px;color:var(--muted);margin-top:5px}

  /* ---------- 答题 ---------- */
  .hud{display:flex;align-items:center;gap:10px;font-size:14px;color:#fff;
    background:rgba(255,255,255,.18);border-radius:10px;padding:8px 12px;margin-top:14px}
  .hud .bar{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.3);overflow:hidden}
  .hud .bar i{display:block;height:100%;width:0;background:#fff;transition:width .3s}
  .fire{white-space:nowrap;font-weight:600}

  .qcard{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:22px 20px;margin-bottom:14px}
  .tag{display:inline-block;font-size:12px;border-radius:99px;padding:2px 10px;
    background:var(--brand-soft);color:var(--brand);margin-bottom:10px}
  .stem{font-size:21px;line-height:1.9;margin:0 0 6px;word-break:break-word}
  .stem .blk{color:var(--brand);letter-spacing:1px}
  .stem u.ul{text-decoration:underline 2px var(--brand);text-underline-offset:4px}
  .cn{color:var(--muted);font-size:14.5px;margin:0 0 4px}
  .qrow{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  .ask{font-size:14px;color:var(--muted);margin:0;flex:1;min-width:150px}
  button.say{font-family:inherit;font-size:14px;padding:9px 15px;border-radius:99px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--brand);white-space:nowrap;
    transition:transform .1s,background .15s}
  button.say:active{transform:scale(.95)}

  /* 每题的限时条：绿 → 琥珀 → 红。
     常态色不能用页面主色（深橙 #ea580c），那个跟警示红太接近，等于没警示。
     不显示秒数——小孩盯数字反而分心，条子用余光就能感知。 */
  .limit{margin:0 0 14px}
  .limit .track{height:10px;border-radius:99px;background:#e6e9ef;overflow:hidden}
  .limit .track i{display:block;height:100%;width:100%;background:#16a34a;
    transition:width .12s linear,background .3s}

  .limit.mid .track i{background:#f59e0b}

  /* 告急阶段：条子自己闪动 + 外圈扩散，余光也能察觉 */
  .limit.low .track i{background:#dc2626;animation:barFlash .55s ease-in-out infinite}
  .limit.low .track{animation:barGlow .55s ease-in-out infinite}
  @keyframes barFlash{
    0%,100%{opacity:1;background:#dc2626}
    50%    {opacity:.6;background:#f87171}
  }
  @keyframes barGlow{
    0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,0)}
    50%    {box-shadow:0 0 0 4px rgba(220,38,38,.18)}
  }

  .opts{display:grid;gap:10px;margin-top:4px}
  /* 选项都是短词（介词、数字）时排成一行：一屏能同时看见题干、选项和反馈，
     手机/iPad 上不用上下找。长句选项仍旧一行一个，挤成一条就没法读了。 */
  .opts.row{display:flex;flex-wrap:wrap}
  .opts.row button.opt{flex:1 1 0;min-width:84px}
  button.opt{font-family:inherit;font-size:19px;min-height:58px;padding:12px 18px;
    border-radius:13px;cursor:pointer;border:2px solid var(--line);background:#fff;
    color:inherit;text-align:center;transition:transform .1s,background .15s,border-color .15s}
  button.opt:active:not(:disabled){transform:scale(.98)}
  button.opt:disabled{cursor:default}
  button.opt.good{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok);font-weight:700}
  button.opt.bad{border-color:var(--no-line);background:var(--no-soft);color:var(--no)}
  button.opt.dim{opacity:.45}

  .fb{margin-top:14px;border-radius:12px;padding:12px 15px;font-size:15px;display:none}
  .fb.show{display:block}
  .fb.y{background:var(--ok-soft);border-left:4px solid var(--ok-line)}
  .fb.n{background:var(--no-soft);border-left:4px solid var(--no-line)}
  .fb .hd{font-weight:700;font-size:16px;margin-bottom:4px}
  .fb.y .hd{color:var(--ok)} .fb.n .hd{color:var(--no)}
  .fb .why{color:#4a5568;font-size:14px;line-height:1.75}
  .fb .why b{color:var(--ink)}

  .acts{display:flex;gap:10px;flex-wrap:wrap}
  button.btn{font-family:inherit;font-size:15px;padding:12px 20px;border-radius:11px;cursor:pointer;
    border:1px solid var(--line);background:#fff;color:var(--ink);
    position:relative;overflow:hidden}
  button.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
  button.btn.wide{flex:1;min-width:140px}
  /* 答错后自动跳题的倒计时条 */
  i.cd{position:absolute;left:0;bottom:0;height:4px;width:100%;
    background:rgba(255,255,255,.6);border-radius:0 2px 2px 0}

  /* ---------- 结算 ---------- */
  .result{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:26px 22px;margin-bottom:16px;text-align:center}
  .result .stars{font-size:46px;letter-spacing:6px;color:#f0a500;line-height:1.2}
  .result h3{margin:10px 0 4px;font-size:21px}
  .result .sub{color:var(--muted);font-size:14.5px;margin:0}
  .mist{background:var(--card);border:1px solid var(--no-line);border-radius:14px;
    padding:6px 18px;margin-bottom:16px}
  .mist summary{cursor:pointer;font-weight:600;padding:12px 0;font-size:15.5px;color:var(--no)}
  .mist ol{margin:0 0 14px;padding-left:22px;font-size:14.5px}
  .mist li{margin:10px 0;line-height:1.8}
  .mist .fix{color:var(--ok);font-weight:600}
  .mist .why{display:block;color:#4a5568;font-size:13.5px}

  .note{background:#fff;border:1px solid var(--line);border-left:4px solid #e9a23b;
    border-radius:12px;padding:16px 18px;font-size:14.5px;line-height:1.85}
  .note code{background:#f3f5f9;border-radius:5px;padding:2px 7px;
    font-family:Consolas,monospace;font-size:13.5px}
  footer{text-align:center;color:var(--muted);font-size:13px;padding:18px 10px 0}

  /* 触屏上点过的按钮会一直挂着 :hover，下一题同一个位置的选项就带着
     上一题的高亮，看着像「半选中」。鼠标才给 hover。 */
  @media (hover:hover) and (pointer:fine){
    button.quit:hover{background:rgba(255,255,255,.3)}
    button.lv:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.07)}
    button.say:hover{background:var(--brand-soft);border-color:#f8b98e}
    button.opt:hover:not(:disabled){background:var(--brand-soft);border-color:#f8b98e}
    button.btn:hover{background:#f3f5f9}
    button.btn.primary:hover{filter:brightness(1.07)}
  }

  @media (max-width:640px){
    .wrap{padding:12px 10px 50px}
    header.top{padding:16px 14px;border-radius:12px;margin-bottom:14px}
    header.top h1{font-size:20px}
    header.top p{font-size:13px}
    .levels{grid-template-columns:1fr}
    .qcard{padding:17px 15px;border-radius:13px}
    .stem{font-size:19px}
    button.opt{font-size:18px;min-height:54px}
    .result{padding:22px 16px}
    .result .stars{font-size:40px}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* =====================================================================
   学习闯关 · 快问快答
   题库不另存一份：运行时把各个练习页抓下来，抠出里面的 DATA 直接用。
   所以以后改题只改练习页，这里自动跟着变。

   加新科目只要两步：在 SOURCES 里加一行，再写一个 from* 适配器把那一页的
   数据结构翻译成 {stem, opts, ans, why, ask} 就行。
   ===================================================================== */

const SOURCES = [
  {file:"介词专项练习.html",         kind:"prep", from:"prep", name:"介词",   icon:"📍", color:"#7a4de0", say:true},
  {file:"划线部分提问专项练习.html", kind:"ul",   from:"ul",   name:"划线提问", icon:"❓", color:"#2f6df6", say:true},
  {file:"递等式计算专项练习.html",   kind:"math", from:"math", name:"递等式计算", icon:"🧮", color:"#0e8a6e"},
  {file:"递等式巧算专项练习.html",   kind:"math", from:"math", name:"递等式巧算", icon:"⚡", color:"#2563a8"},
  // 阅读理解没有放进来：它的题几乎都要对着原文或材料才能答
  //（「第③段……」「这个故事……」「小刚逾期 5 天要交多少钱」——规则在材料里）。
  // 搬进快问快答就成了无源之水，孩子只能瞎猜。剩下真正自洽的只有三道
  // 「这句话用的修辞手法是」，撑不起一关，不如不做。
  // 以后要补语文闯关，正路是单独写一份字词句基础练习页，那类题天生自洽。
];

const PER_LEVEL = 10;                 // 每关题数
const SAVE_KEY  = "en-arcade-v1";

// 答错以后停留多久再自动跳下一题（毫秒）。
// 从朗读结束那一刻才开始算，讲解越长等得越久；随时可以点按钮提前跳。
// 觉得太慢/太快就改这三个数。
const WAIT_BASE     = 3000;           // 起步至少停这么久
const WAIT_PER_CHAR = 80;             // 讲解每多一个字，多停一会儿
const WAIT_MAX      = 9000;           // 封顶，再长也不等了

// 题库太小时的兜底干扰项
const FALLBACK = {
  prep:["in","on","at","under","behind","near","next to","between","for","with","to","by","about","of","from","above"],
  ul:["What","Where","When","Who","Whose","Why","How","How many","How much","How old","What colour","What time","What day"],
  math:[],
};

/* ---------------- 小工具 ---------------- */
const $  = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
// hint 里常带中文说明，如 "Where（I → you）"，只取英文部分当选项
const clean = h => String(h||"").split("（")[0].split("(")[0].replace(/\s*…\s*/g," … ").trim();

let save = {};
try{ save = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}"); }catch(e){ save = {}; }
save.stars = save.stars || {};        // {levelId: 0~3}
save.best  = save.best  || {};        // {levelId: 最高答对数}
if(save.sound === undefined) save.sound = true;
if(save.speak === undefined) save.speak = true;
if(save.limit === undefined) save.limit = 10;   // 每题限时秒数，0 = 不限时
const persist = () => { try{ localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }catch(e){} };

/* ---------------- 声音：对错提示音 ---------------- */
let actx = null;
function beep(ok){
  if(!save.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state === "suspended") actx.resume();
    const seq = ok ? [[660,0],[880,.09]] : [[300,0],[220,.11]];
    seq.forEach(([f,t])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type = ok ? "sine" : "triangle";
      o.frequency.value = f;
      o.connect(g); g.connect(actx.destination);
      const s = actx.currentTime + t;
      g.gain.setValueAtTime(.0001, s);
      g.gain.exponentialRampToValueAtTime(.22, s+.015);
      g.gain.exponentialRampToValueAtTime(.0001, s+.13);
      o.start(s); o.stop(s+.15);
    });
  }catch(e){}
}

/* ---------------- 朗读：顺便练听力，也是「熏听」的试水 ---------------- */
let voices = [];
function loadVoices(){ try{ voices = speechSynthesis.getVoices()||[]; }catch(e){ voices=[]; } }
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function enVoice(){
  if(!voices.length) loadVoices();
  return voices.find(v=>/en[-_]GB/i.test(v.lang))
      || voices.find(v=>/en[-_]US/i.test(v.lang))
      || voices.find(v=>/^en/i.test(v.lang)) || null;
}
// 朗读英文句子；done 在读完（或读不了）时回调。
// force=true 时无视「朗读关」的开关——手动点喇叭要能响。
// speakGen：每次新朗读都会打断上一条，被打断的那条不许再执行它的回调，
// 否则「重听」会顺手触发上一次朗读挂着的「自动跳下一题」。
let speakGen = 0;
// q 传进来是为了判断这题该不该念；不传就是调用方已经确认过了
function speak(text, done, force){
  const fin = done || function(){};
  if((!save.speak && !force) || !window.speechSynthesis || !text){ fin(); return; }
  const gen = ++speakGen;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = enVoice();
    if(v) u.voice = v;
    u.lang = (v && v.lang) || "en-US";
    u.rate = .82;                       // 放慢一点，四年级听得清
    let called = false;
    const once = () => { if(!called){ called = true; if(gen === speakGen) fin(); } };
    u.onend = once; u.onerror = once;
    setTimeout(once, 6000);             // 兜底：有些浏览器不触发 onend
    speechSynthesis.speak(u);
  }catch(e){ fin(); }
}
// 彻底闭嘴：先把代次推进一格作废掉挂着的回调，再取消朗读。
// 顺序不能反——cancel() 会触发 onend，而那个回调可能挂着「跳下一题」，
// 人都退出到关卡列表了还会被拽回题目里。
function hush(){
  speakGen++;
  if(window.speechSynthesis){ try{ speechSynthesis.cancel(); }catch(e){} }
}

// 把题干变成能读的句子：去掉中文、空格线读成停顿
const sayable = (s, fill) => String(s)
  .replace(/【(.*?)】/g, "$1")
  .replace(/_+/g, fill ? (" " + fill + " ") : " , ")
  .replace(/[（(].*?[)）]/g, "")
  .replace(/\s+/g," ").trim();

/* ---------------- 抓题库 ---------------- */
async function fetchBank(file){
  const res = await fetch(file, {cache:"no-cache"});
  if(!res.ok) throw new Error(file + " 读取失败（" + res.status + "）");
  const txt = await res.text();
  const m = txt.match(/const\s+DATA\s*=\s*(\[[\s\S]*?^\];)/m);
  if(!m) throw new Error(file + " 里没找到题库 DATA");
  return new Function("return " + m[1].replace(/;\s*$/, ""))();
}

/* ---------------- 造三选一 ---------------- */
// ans 正确答案；pool 同一专项里出现过的词；ban 不能当干扰项的（其它正确说法）；must 一定要放进去的（典型错解）
// 干扰项优先从本专项内部取——同一关的词才构成真正的辨析。
// 本专项只有两个词可选时（比如「划线的是主语」只有 Who / What），就老老实实出两个选项，
// 不从兜底池硬塞一个明显不沾边的进来充数，那样反而把这关的考点冲淡了。
function mkOpts(ans, pool, ban, must, kind){
  const no = new Set([ans, ...(ban||[])].map(x=>String(x).toLowerCase()));
  const out = [ans];
  if(must && !no.has(String(must).toLowerCase())){ out.push(must); no.add(String(must).toLowerCase()); }
  const take = list => {
    for(const w of list){
      if(out.length >= 3) return;
      const k = String(w).toLowerCase();
      if(!w || no.has(k)) continue;
      out.push(w); no.add(k);
    }
  };
  take(shuffle([...pool]));
  if(out.length < 2) take(FALLBACK[kind] || []);   // 只在连一个干扰项都凑不出时兜底
  return shuffle(out);
}

/* ---------------- 介词页 → 题目 ---------------- */
function fromPrep(set){
  const pool = new Set();
  set.parts.forEach(p => p.items.forEach(it => {
    if(p.type === "choice") (it.opts||[]).forEach(o => pool.add(o));
    if(p.type === "blank")  (it.a||[]).forEach(alts => pool.add(alts[0]));
    if(p.type === "fix")    (it.a||[]).forEach(x => pool.add(x));
  }));

  const qs = [];
  set.parts.forEach(p => p.items.forEach(it => {
    if(p.type === "choice"){
      qs.push({stem:it.s, cn:it.cn, opts:shuffle(it.opts.slice()), ans:it.opts[it.a],
               why:it.why, ask:"选一个填进横线", kind:"prep"});

    }else if(p.type === "blank" && (it.a||[]).length === 1){
      const alts = it.a[0], ans = alts[0];
      qs.push({stem:it.tpl, cn:it.cn, opts:mkOpts(ans, pool, alts.slice(1), null, "prep"), ans,
               why:it.why, ask:"选一个填进横线", kind:"prep",
               also:alts.slice(1)});

    }else if(p.type === "fix"){
      const bad = (String(it.s).match(/【(.*?)】/) || [])[1];   // 原句里错的那个词，拿来当典型干扰项
      const alts = it.a || [], ans = alts[0];
      if(!ans) return;
      qs.push({stem:String(it.s).replace(/【.*?】/, "___"), cn:it.cn,
               opts:mkOpts(ans, pool, alts.slice(1), bad, "prep"), ans,
               why:it.why, ask:"这句话原来用错了，应该填哪个？", kind:"prep",
               tag:"易错", also:alts.slice(1)});
    }
  }));
  return qs;
}

/* ---------------- 划线提问页 → 题目 ---------------- */
// blank 和 full 两种题都带 hint（Where / How old / What colour…），
// 正好出成「对划线部分提问该用哪个疑问词」——这才是这个专项的真考点。
function fromUl(set){
  const pool = new Set();
  set.parts.forEach(p => p.items.forEach(it => { if(it.hint) pool.add(clean(it.hint)); }));

  const qs = [], seen = new Set();
  set.parts.forEach(p => p.items.forEach(it => {
    const ans = clean(it.hint);
    if(!ans || !it.q) return;
    const key = it.q + "|" + ans;
    if(seen.has(key)) return;
    seen.add(key);
    const marked = (String(it.q).match(/【(.*?)】/) || [])[1] || "";
    qs.push({stem:it.q, cn:"", opts:mkOpts(ans, pool, [], null, "ul"), ans,
             why:"划线的是「" + marked + "」，所以用 " + ans + " 来问。",
             ask:"对划线部分提问，用哪个疑问词？", kind:"ul"});
  }));
  return qs;
}

/* ---------------- 数学：递等式计算 / 巧算 → 题目 ---------------- */
const STEP_CN = ["①","②","③","④","⑤","⑥","⑦","⑧"];
// 题目里混着 × ÷ − 和中括号，先翻成 JS 认识的写法。
// 只放行数字和运算符，别的一律拒掉——题库是自己写的，但 eval 还是要守住入口。
function toJs(t){
  const js = String(t).replace(/【|】/g,"").replace(/×/g,"*").replace(/÷/g,"/")
    .replace(/[−–—]/g,"-").replace(/\[/g,"(").replace(/\]/g,")").replace(/\s/g,"");
  return /^[0-9+\-*/().]+$/.test(js) ? js : null;
}
function val(t){
  const js = toJs(t); if(!js) return null;
  try{ const v = eval(js); return Number.isFinite(v) ? v : null; }catch(e){ return null; }
}
// 从左往右硬算，无视「先乘除后加减」——四年级最典型的错法，拿来当干扰项最像
function ltr(t){
  const js = toJs(t);
  if(!js || /[()]/.test(js)) return null;
  const tk = js.match(/\d+\.?\d*|[+\-*/]/g);
  if(!tk || tk.length < 5) return null;           // 只有一个运算符时左右算法一样，没意义
  let v = parseFloat(tk[0]);
  for(let i=1;i<tk.length;i+=2){
    const b = parseFloat(tk[i+1]);
    if(tk[i]==="+") v+=b; else if(tk[i]==="-") v-=b; else if(tk[i]==="*") v*=b; else v/=b;
  }
  return Number.isFinite(v) ? v : null;
}
// 解决问题那几题前面带题干，"列式：" 后面才是算式
const exprOf = e => String(e).split("列式：").pop().trim();
// 凑两个得数干扰项：优先用真实误算（算错顺序、算到一半就停），再退到位值滑错
function numOpts(ans, cands){
  const seen = new Set([ans]), out = [];
  for(const c of cands.concat([ans*10, ans/10, ans+10, Math.abs(ans-10), ans*2])){
    if(out.length >= 2) break;
    if(!Number.isFinite(c) || c <= 0 || Math.abs(c%1) > 1e-9) continue;
    if(seen.has(c)) continue;
    seen.add(c); out.push(c);
  }
  return out.length >= 2 ? shuffle([ans, ...out]) : null;
}
function fromMath(set){
  const qs = [];
  set.parts.forEach(p => p.items.forEach(it => {

    if(p.type === "order"){
      qs.push({stem:it.e, ask:"这道题应该先算哪一步？", kind:"math",
               opts:shuffle(it.opts.slice()), ans:it.opts[it.a], why:it.why});

    }else if(p.type === "calc"){
      const e = exprOf(it.e), ans = val(e);
      if(ans === null) return;
      // 每一步填的数都在 lines 的【】里，最后一个就是得数
      const mid = [];
      it.lines.forEach(l => (l.match(/【(.*?)】/g)||[]).forEach(x => mid.push(+x.slice(1,-1))));
      const last = mid.pop();
      if(!Number.isFinite(last) || Math.abs(ans - last) > 1e-9) return;   // 对不上就别出，宁缺毋滥
      const opts = numOpts(ans, [ltr(e)].concat(mid.reverse()));          // 算到一半就停下，最后一个中间值最像
      if(!opts) return;
      qs.push({stem:e, ask:"这道题的得数是多少？", kind:"math", num:true,
               opts:opts.map(String), ans:String(ans), why:it.why});

    }else if(p.type === "fix"){
      const ans = Number(it.a);
      if(!Number.isFinite(ans)) return;
      // 错解自己算出来的那个数，是现成的最佳干扰项
      const bogus = val(it.sol[it.sol.length-1]);
      const opts = numOpts(ans, [bogus, val(it.sol[it.sol.length-2] || "")]);
      if(!opts) return;
      qs.push({stem:exprOf(it.e),
               cn:"别人是这样算的：" + it.sol.map((l,k)=>STEP_CN[k]+" = "+l).join("　"),
               ask:"这样算错了，正确的得数是多少？", kind:"math", tag:"找错", num:true,
               opts:opts.map(String), ans:String(ans), why:it.why});
    }
  }));
  return qs;
}

const ADAPTERS = {prep:fromPrep, ul:fromUl, math:fromMath};

/* ---------------- 状态 ---------------- */
const COURSES = [];
let loadFailed = [];      // 哪几科的题库没读进来，首页底部提示用
let S = {};
/* ---------------- 启动 ---------------- */
boot();

async function boot(){
  $("app").innerHTML = '<header class="top"><h1>🎮 学习闯关</h1>'
    + '<p>正在读题库…</p></header>';

  if(location.protocol === "file:"){ offline("本地双击打开"); return; }

  for(const src of SOURCES){
    try{
      const data = await fetchBank(src.file);
      const adapt = ADAPTERS[src.from];
      let levels = data.map(set => {
        const qs = adapt(set);
        // 只有英文题才朗读。数学和语文交给英文语音念，出来的是噪音
        qs.forEach(q => { q.say = !!src.say; });
        return {id:src.kind + "-" + set.id, title:set.title, qs};
      }).filter(l => l.qs.length > 0);
      if(levels.length) COURSES.push(Object.assign({}, src, {levels}));
    }catch(err){
      // 一科读不到不该拖垮整个游戏，记下来照常开别的科
      loadFailed.push(src.name + "（" + (err && err.message || err) + "）");
    }
  }
  if(!COURSES.length){ offline(loadFailed.join("；") || "题库是空的"); return; }
  home();
}

/* 题库读不到时的提示（最常见就是 file:// 直接打开） */
function offline(reason){
  $("app").innerHTML =
    '<header class="top"><h1>🎮 学习闯关</h1><p>题库没读进来</p></header>'
  + '<div class="note"><b>原因：' + esc(reason) + '</b><br><br>'
  + '这个页面要去读同目录下几个练习页里的题目，'
  + '而浏览器不允许本地双击打开的网页读取同目录的其它文件。<br><br>'
  + '<b>两种办法：</b><br>'
  + '① 直接用线上地址打开（手机扫码进的就是线上的，不受影响）；<br>'
  + '② 电脑上想本地玩，在这个文件夹里开个小服务器：<br>'
  + '<code>python -m http.server 8000</code><br>'
  + '然后浏览器访问 <code>http://localhost:8000/学习闯关.html</code>'
  + '</div><footer><a href="index.html">← 回导航页</a></footer>';
}

/* ---------------- 首页：关卡列表 ---------------- */
function home(){
  stopCountdown(); stopAdvance(); stopLimit();
  let h = '<header class="top"><h1>🎮 学习闯关</h1>'
        + '<p>一题一选，点完马上知道对错 · 做错的会在本关结束后再问一遍</p>'
        + '<div class="toprow">'
        + '<button class="tgl' + (save.sound?"":" off") + '" id="tSound">' + (save.sound?"🔊 音效开":"🔇 音效关") + '</button>'
        + '<button class="tgl' + (save.speak?"":" off") + '" id="tSpeak">' + (save.speak?"🗣 朗读开":"🤐 朗读关") + '</button>'
        + '<button class="tgl' + (save.limit?"":" off") + '" id="tLimit">'
        + (save.limit ? "⏱ 限时 " + save.limit + " 秒" : "⏱ 不限时") + '</button>'
        + '<a href="index.html" style="margin-left:auto;font-size:13px">← 回导航页</a>'
        + '</div></header>';

  COURSES.forEach((c, ci) => {
    h += '<h2 class="g">' + c.icon + ' ' + esc(c.name) + '</h2><div class="levels">';
    c.levels.forEach((lv, li) => {
      const open = li === 0 || (save.stars[c.levels[li-1].id] || 0) >= 1;
      const st = save.stars[lv.id] || 0;
      const n = Math.min(PER_LEVEL, lv.qs.length);
      h += '<button class="lv" style="--c:' + c.color + '" data-c="' + ci + '" data-l="' + li + '"'
         + (open ? "" : " disabled") + '>'
         + '<div class="t">' + esc(lv.title) + '</div>'
         + '<div class="d">' + n + ' 题 · 共 ' + lv.qs.length + ' 题可抽</div>'
         + (open
             ? '<div class="st">' + "★".repeat(st) + "☆".repeat(3-st) + '</div>'
             : '<div class="lock">🔒 先过上一关</div>')
         + '</button>';
    });
    h += '</div>';
  });

  const done = COURSES.reduce((n,c)=>n + c.levels.filter(l=>(save.stars[l.id]||0)>=1).length, 0);
  const all  = COURSES.reduce((n,c)=>n + c.levels.length, 0);
  const qn   = COURSES.reduce((n,c)=>n + c.levels.reduce((m,l)=>m+l.qs.length,0), 0);
  h += '<footer>已通关 ' + done + ' / ' + all + ' 关 · 共 ' + qn + ' 道题可抽'
     + (loadFailed.length ? '<br><span style="color:#c2410c">这几科没读进来：' + esc(loadFailed.join("；")) + '</span>' : "")
     + '<br>题目直接取自各个练习页，改题不用改这里</footer>';

  $("app").innerHTML = h;
  $("tSound").onclick = () => { save.sound = !save.sound; persist(); if(save.sound) beep(true); home(); };
  $("tSpeak").onclick = () => { save.speak = !save.speak; persist(); if(!save.speak) hush(); home(); };
  // 点一下换一档：不限时 → 20 → 15 → 10 → 5 → 不限时
  $("tLimit").onclick = () => {
    const steps = [0, 20, 15, 10, 5];
    save.limit = steps[(steps.indexOf(save.limit) + 1) % steps.length];
    persist(); home();
  };
  document.querySelectorAll("button.lv").forEach(b => {
    if(!b.disabled) b.onclick = () => start(+b.dataset.c, +b.dataset.l);
  });
}

/* ---------------- 开一关 ---------------- */
function start(ci, li){
  stopCountdown(); stopAdvance(); stopLimit();
  const c = COURSES[ci], lv = c.levels[li];
  S = {
    ci, li, course:c, level:lv,
    qs: shuffle(lv.qs.slice()).slice(0, PER_LEVEL),
    i: 0, right: 0, streak: 0, bestStreak: 0,
    timeout: 0,         // 本关超时了几题，结算时提示用
    wrong: [],          // 本关错题（用于结算回顾）
    queue: [],          // 答错的题，本关末尾再问一遍
    reviewing: false,
    locked: false,
  };
  question();
}

function question(){
  const q = S.qs[S.i];
  const total = S.qs.length;
  const pct = Math.round(S.i / total * 100);
  S.phase = "ask";                      // ask → 还没答；right / wrong → 已判完

  $("app").innerHTML =
    '<header class="top">'
  + '<div class="hrow"><h1>' + S.course.icon + ' ' + esc(S.level.title) + '</h1>'
  + '<button class="quit" id="quit">✕ 退出</button></div>'
  + '<p>' + (S.reviewing ? "错题再来一遍 · 这轮不计分" : "第 " + (S.i+1) + " / " + total + " 题") + '</p>'
  + '<div class="hud"><span>✅ ' + S.right + '</span>'
  + '<div class="bar"><i style="width:' + pct + '%"></i></div>'
  + '<span class="fire">' + (S.streak >= 2 ? "🔥 连对 " + S.streak : "&nbsp;") + '</span></div>'
  + '</header>'

  + '<div class="qcard">'
  + (q.tag ? '<div class="tag">' + esc(q.tag) + '</div>' : "")
  + '<p class="stem">' + stemHtml(q.stem) + '</p>'
  + (q.cn ? '<p class="cn">' + esc(q.cn) + '</p>' : "")
  + '<div class="qrow"><p class="ask">' + esc(q.ask) + '</p>'
  + (q.say ? '<button class="say" id="say">🔊 再听一遍</button>' : "") + '</div>'
  + '</div>'

  + (save.limit && !S.reviewing
      ? '<div class="limit" id="lim"><div class="track"><i id="limbar"></i></div></div>'
      : "")

  + '<div class="opts' + (inRow(q.opts) ? " row" : "") + '" id="opts">'
  + q.opts.map((o,k) => '<button class="opt" data-k="' + k + '">' + esc(o) + '</button>').join("")
  + '</div>'

  + '<div class="fb" id="fb"></div>'
  + '<div class="acts" id="acts" style="margin-top:14px"></div>';

  document.querySelectorAll("#opts button.opt").forEach(b => {
    b.onclick = () => answer(+b.dataset.k);
  });
  if($("say")) $("say").onclick = replay;
  $("quit").onclick = quit;

  // 题目一出来先读一遍（听力铺垫），读完才开始计时
  if(q.say) speak(sayable(q.stem, null), () => startLimit());
  else startLimit();
}

// 选项能不能排成一行：短词才行（介词、数字、单个单词）。
// 阅读理解那种整句选项挤成一条谁也读不下去，还是一行一个。
// 中文一个字按两个字符算，不然「圆珠笔」这种看着短其实很宽。
function inRow(opts){
  if(!opts || opts.length < 2 || opts.length > 4) return false;
  const w = s => String(s).replace(/[^\x00-\xff]/g, "aa").length;
  return opts.every(o => w(o) <= 10) && opts.reduce((n,o) => n + w(o), 0) <= 30;
}

// ___ 显示成橙色横线；【】里的内容画下划线（划线部分提问用）
function stemHtml(s){
  return esc(s)
    .replace(/_{2,}/g, '<span class="blk">______</span>')
    .replace(/【(.*?)】/g, '<u class="ul">$1</u>');
}

/* ---------------- 答错后的倒计时 ---------------- */
// 讲解越长给的时间越多，但封顶；点按钮可以随时提前跳。
const waitMs = q => Math.min(WAIT_MAX, WAIT_BASE + String(q.why || "").length * WAIT_PER_CHAR);

let cdTimer = null, advTimer = null;
function stopCountdown(){ if(cdTimer){ clearInterval(cdTimer); cdTimer = null; } }
function stopAdvance(){ if(advTimer){ clearTimeout(advTimer); advTimer = null; } }
function startCountdown(ms){
  stopCountdown();
  const btn = $("go"), bar = $("cd");
  if(!btn) return;                       // 已经跳走了
  const t0 = Date.now();
  const tick = () => {
    const left = ms - (Date.now() - t0);
    if(left <= 0){ stopCountdown(); next(); return; }
    if(bar) bar.style.width = (left / ms * 100) + "%";
    btn.firstChild.nodeValue = "知道了，下一题 →（" + Math.ceil(left/1000) + "）";
  };
  tick();
  cdTimer = setInterval(tick, 100);
}

/* ---------------- 喇叭：随时重听 ---------------- */
// 答题前读原句（横线读成停顿，不泄漏答案）；答完后读补全的完整句。
// 重听期间先把自动跳题停住，读完再按当前所处的阶段接回去，
// 不然句子读到一半就被翻页了。
function replay(){
  const q = S.qs[S.i];
  if(!q) return;
  // 还没作答时，把剩下的秒数记住，读完接着走——重听不该变相扣时间
  const left = (S.phase === "ask" && limTimer) ? limLeft : null;
  stopCountdown(); stopAdvance(); stopLimit();
  const fill = S.phase === "ask" ? null : q.ans;
  speak(sayable(q.stem, fill), () => {
    if(S.phase === "ask")        startLimit(left);
    else if(S.phase === "right") advTimer = setTimeout(next, 180);
    else if(S.phase === "wrong") startCountdown(waitMs(q));
  }, true);
}

/* ---------------- 中途退出 ---------------- */
// 已经答过题才确认一下，一题没答就直接走，免得变成骚扰。
function quit(){
  const done = S.right + (S.wrong ? S.wrong.length : 0);
  if(done > 0 && !confirm("现在退出，这一关的成绩就不算了。\n确定要退出吗？")) return;
  hush();
  home();
}

/* ---------------- 每题限时 ---------------- */
// 计时从「朗读完题目」才开始，不然读句子的时间就白白吃掉她的思考时间了。
// 点喇叭重听会暂停，读完接着走剩下的秒数，免得重听变成变相扣时间。
let limTimer = null, limLeft = 0, limTotal = 0;

function stopLimit(){ if(limTimer){ clearInterval(limTimer); limTimer = null; } }

function startLimit(ms){
  stopLimit();
  // 错题重练那轮不计时：那轮本来就不计分，目的是重新学会，再加压力没道理
  if(!save.limit || !S.qs || S.phase !== "ask" || S.reviewing) return;
  limTotal = save.limit * 1000;
  const base = (ms == null ? limTotal : ms);
  const t0 = Date.now();
  limLeft = base;
  paintLimit();
  limTimer = setInterval(() => {
    limLeft = base - (Date.now() - t0);
    if(limLeft <= 0){ stopLimit(); limLeft = 0; paintLimit(); timeUp(); return; }
    paintLimit();
  }, 100);
}

function paintLimit(){
  const box = $("lim");
  if(!box) return;
  // 告急的时机跟着总时长走：5 秒档剩 1.75 秒变红，10 秒以上统一剩 3 秒变红。
  // 固定 3 秒的话，5 秒档会有六成时间都是红的，警示就没意义了。
  const low = limLeft <= Math.min(3000, limTotal * 0.35);
  box.classList.toggle("low", low);
  box.classList.toggle("mid", !low && limLeft <= limTotal * 0.6);
  $("limbar").style.width = Math.max(0, limLeft / limTotal * 100) + "%";
}

// 时间到：按答错处理，进错题本、关底重练，只是提示语不一样
function timeUp(){
  if(S.locked) return;
  S.locked = true;
  const q = S.qs[S.i];
  if(!S.reviewing) S.timeout++;
  reveal(q, null);
  beep(false);
  wrongFlow(q, "⏰ 时间到，答案是 " + esc(q.ans));
}

/* ---------------- 揭晓答案（答错和超时共用） ---------------- */
function reveal(q, pickedK){
  document.querySelectorAll("#opts button.opt").forEach(b => {
    b.disabled = true;
    const v = q.opts[+b.dataset.k];
    if(String(v).toLowerCase() === String(q.ans).toLowerCase()) b.classList.add("good");
    else if(pickedK != null && +b.dataset.k === pickedK) b.classList.add("bad");
    else b.classList.add("dim");
  });
}

function wrongFlow(q, headline){
  S.phase = "wrong";
  S.streak = 0;
  if(!S.reviewing){
    S.wrong.push(q);
    S.queue.push(q);
  }
  $("fb").className = "fb n show";
  $("fb").innerHTML = '<div class="hd">' + headline + '</div>'
                    + (q.why ? '<div class="why">' + esc(q.why) + '</div>' : "");
  // 不马上跳：先把正确句子读完，再留一段时间看讲解，到点自动走
  $("acts").innerHTML = '<button class="btn primary wide" id="go">知道了，下一题 →<i class="cd" id="cd"></i></button>';
  $("go").onclick = () => { stopCountdown(); next(); };
  if(q.say) speak(sayable(q.stem, q.ans), () => startCountdown(waitMs(q)));
  else startCountdown(waitMs(q));
}

/* ---------------- 判题 ---------------- */
function answer(k){
  if(S.locked) return;
  S.locked = true;
  stopLimit();

  const q   = S.qs[S.i];
  const got = q.opts[k];
  // 有些题不止一种正确说法（above / over、next to / beside），都算对
  const okList = [q.ans].concat(q.also || []).map(x => String(x).toLowerCase());
  const ok = okList.indexOf(String(got).toLowerCase()) > -1;

  reveal(q, k);
  beep(ok);

  if(ok){
    S.phase = "right";
    if(!S.reviewing){ S.right++; S.streak++; S.bestStreak = Math.max(S.bestStreak, S.streak); }
    const cheer = ["太棒了！","就是它！","漂亮 👍","完全正确！","稳！"][Math.random()*5|0];
    $("fb").className = "fb y show";
    $("fb").innerHTML = '<div class="hd">✅ ' + cheer + (S.streak >= 3 ? "　🔥 连对 " + S.streak : "") + '</div>'
                      + (q.why ? '<div class="why">' + esc(q.why) + '</div>' : "");
    // 答对了就不再读一遍补完整的句子：题干刚念过，答案也看见了，
    // 再听一遍只是在等。想听还可以点喇叭。读错那条留着，那才需要。
    hush();
    stopAdvance();
    advTimer = setTimeout(next, 700);

  }else{
    wrongFlow(q, "❌ 正确答案是 " + esc(q.ans));
  }
}

function next(){
  stopCountdown();
  stopAdvance();
  stopLimit();
  S.locked = false;
  S.i++;
  if(S.i < S.qs.length){ question(); return; }

  // 正式一轮打完，还有错题就自动再过一遍
  if(!S.reviewing && S.queue.length){
    S.reviewing = true;
    S.qs = shuffle(S.queue.slice());
    S.queue = [];
    S.i = 0;
    question();
    return;
  }
  result();
}

/* ---------------- 结算 ---------------- */
function result(){
  const total = S.wrong.length + S.right;        // 本关正式轮的题数
  const rate  = total ? S.right / total : 0;
  const stars = rate >= 1 ? 3 : rate >= .8 ? 2 : rate >= .6 ? 1 : 0;

  if(stars > (save.stars[S.level.id] || 0)) save.stars[S.level.id] = stars;
  if(S.right > (save.best[S.level.id] || 0))  save.best[S.level.id]  = S.right;
  persist();

  const c = S.course;
  const hasNext = S.li + 1 < c.levels.length;
  const word = stars === 3 ? "全对！太厉害了 🎉"
             : stars === 2 ? "很不错 👍"
             : stars === 1 ? "过关啦"
             : "差一点点，再来一次就好";

  let h = '<header class="top"><h1>' + c.icon + ' ' + esc(S.level.title) + '</h1>'
        + '<p>本关结束</p></header>'
        + '<div class="result">'
        + '<div class="stars">' + "★".repeat(stars) + "☆".repeat(3-stars) + '</div>'
        + '<h3>' + word + '</h3>'
        + '<p class="sub">答对 ' + S.right + ' / ' + total
        + (S.timeout ? ' · ⏰ 超时 ' + S.timeout + ' 题' : "")
        + (S.bestStreak >= 3 ? ' · 最长连对 🔥 ' + S.bestStreak : "") + '</p>'
        + (S.timeout >= 3
            ? '<p class="sub" style="color:var(--no);margin-top:6px">超时有点多，'
              + '可以回关卡列表把「⏱ 限时」调松一点</p>'
            : "")
        + '</div>';

  if(S.wrong.length){
    h += '<details class="mist" open><summary>❌ 这关错了 ' + S.wrong.length + ' 题，再看一眼</summary><ol>';
    S.wrong.forEach(q => {
      h += '<li>' + stemHtml(q.stem)
         + (q.cn ? ' <span style="color:var(--muted)">' + esc(q.cn) + '</span>' : "")
         + '<br>→ <span class="fix">' + esc(q.ans) + '</span>'
         + (q.why ? '<span class="why">' + esc(q.why) + '</span>' : "")
         + '</li>';
    });
    h += '</ol></details>';
  }

  h += '<div class="acts">'
     + '<button class="btn wide" id="again">↻ 再玩一次</button>'
     + (hasNext && stars >= 1
         ? '<button class="btn primary wide" id="nextlv">下一关 →</button>'
         : '')
     + '<button class="btn wide" id="back">回关卡列表</button>'
     + '</div>'
     + '<footer>这里的分数只存在这台设备上 · 想逐题练、看讲解，去 '
     + '<a href="' + encodeURI(c.file) + '">' + esc(c.name) + '练习页</a></footer>';

  $("app").innerHTML = h;
  $("again").onclick = () => start(S.ci, S.li);
  $("back").onclick  = home;
  if($("nextlv")) $("nextlv").onclick = () => start(S.ci, S.li + 1);

  if(stars === 3) beep(true);
}
</script>
