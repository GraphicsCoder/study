<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>大象搬家 · 介词小游戏</title>
<link rel="icon" href="favicon.svg?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#15314f;
    overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    font:16px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#fff}
  canvas{display:block;width:100%;height:100%}

  .layer{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 20px);
    background:rgba(10,26,43,.84)}
  .layer.show{display:flex}
  .layer h1{font-size:29px;margin:0 0 6px}
  .layer h2{font-size:23px;margin:0 0 10px}
  .layer p{margin:0 0 14px;font-size:15px;color:#c3d7ee;max-width:20em;line-height:1.9}
  .layer b{color:#ffd166}
  .layer button{font-family:inherit;font-size:19px;font-weight:700;padding:14px 34px;border-radius:99px;
    border:none;background:#ffd166;color:#15314f;cursor:pointer;box-shadow:0 6px 0 #d9a93f;
    transition:transform .08s,box-shadow .08s}
  .layer button:active{transform:translateY(4px);box-shadow:0 2px 0 #d9a93f}
  .layer button.ghost{background:transparent;color:#c3d7ee;box-shadow:none;font-size:15px;font-weight:500;padding:10px 18px}
  .layer button.ghost:active{transform:none}
  /* 「选关」原来跟「返回」一样是淡淡的一行字，混在背景里看不见。
     给它描一圈黄边、加点底色，做成看得出来能按的胶囊。 */
  .layer button.ghost.key{border:2px solid #ffd166;background:rgba(255,209,102,.14);
    color:#ffd166;font-size:17px;font-weight:700;padding:11px 26px}
  .layer button.ghost.key:active{transform:scale(.97)}
  .row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;justify-content:center}
  .stat{font-size:15px;color:#c3d7ee;margin-top:10px;line-height:2}
  .stat em{font-style:normal;color:#fff;font-weight:700;font-size:17px}
  .stat .big{font-size:40px;font-weight:800;color:#ffd166;line-height:1.3}
  .stat .combo{font-size:17px;color:#fff;margin:2px 0 8px}
  .stat .combo em{color:#ff9f45;font-size:20px}
  .stat .wrongs{margin-top:12px;background:rgba(255,255,255,.08);border-radius:12px;
    padding:10px 12px;font-size:14px;color:#c3d7ee;text-align:left;line-height:1.9}
  .stat .wrongs b{display:block;color:#ffd166;font-size:13px;margin-bottom:4px}
  .stat .wrongs span{display:inline-block;background:rgba(0,0,0,.2);border-radius:8px;
    padding:2px 9px;margin:2px 5px 2px 0;color:#fff;font-weight:600}

  #pick{max-height:50vh;overflow:auto;width:100%;max-width:330px;-webkit-overflow-scrolling:touch}
  #pick{display:flex;flex-direction:column;gap:10px;align-items:stretch}
  #pick .lv .sub{display:block;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.65);margin-top:2px}
  #pick .lv.on .sub{color:rgba(255,209,102,.8)}
  #pick .lv{width:100%;padding:10px 0;border-radius:12px;border:2px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08);color:#fff;font-size:15px;font-weight:700;cursor:pointer;
    box-shadow:none;transform:none}
  #pick .lv.on{border-color:#ffd166;background:rgba(255,209,102,.18);color:#ffd166}
  #pick .lv.lock{opacity:.38;cursor:not-allowed}
  #pick .lv:active{transform:scale(.96)}

  .home,#pausebtn,#saybtn{font-family:inherit;border:none;cursor:pointer;position:fixed;z-index:5;
    font-size:14px;padding:6px 12px;border-radius:99px;background:rgba(0,0,0,.2);color:rgba(255,255,255,.8)}
  .home{left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 10px)}
  #pausebtn{right:calc(env(safe-area-inset-right) + 10px);top:calc(env(safe-area-inset-top) + 10px)}
  /* 再听一遍：放在右下角，拖东西的手正好够得着 */
  #saybtn{right:calc(env(safe-area-inset-right) + 10px);bottom:calc(env(safe-area-inset-bottom) + 64px);
    font-size:20px;padding:10px 14px;display:none}
  #choices{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 12px);
    display:none;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 12px;z-index:4}
  #choices.show{display:flex}
  #choices button{font-family:inherit;font-size:16px;font-weight:600;padding:12px 16px;border-radius:14px;
    border:2px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;cursor:pointer;
    backdrop-filter:blur(2px);min-width:40%;flex:1 1 40%;max-width:46%}
  #choices button:active{transform:scale(.97)}
  #choices button.right{border-color:#5ad2a0;background:rgba(90,210,160,.3)}
  #choices button.wrongpick{border-color:#ff7a9c;background:rgba(255,122,156,.28)}
  body.playing #syncchip{display:none !important}
  @media (prefers-reduced-motion:reduce){ .layer button{transition:none} }
</style>
</head>
<body>

<canvas id="cv"></canvas>
<button class="home" id="homebtn">‹ 返回</button>
<button id="pausebtn">⏸</button>
<button id="saybtn" title="再听一遍">🔊</button>

<!-- 反过来问的时候用：东西已经摆好，从四个短语里挑一个。
     用 DOM 按钮而不是画在 canvas 上：点击区域、换行、长句子缩字号都是白送的 -->
<div id="choices"></div>

<div class="layer show" id="start">
  <h1>🐘 大象搬家</h1>
  <p>听一句英语，把东西<b>拖到正确的位置</b>；<br>
     也会反过来问 <b>Where is the cat?</b>，从四个说法里挑一个。<br>
     三关：in / on / under → 加 next to、behind → 全部含 between。<br>
     放错不扣心，会告诉你刚才那儿是什么。</p>
  <button id="go">开始</button>
  <div class="row">
    <button class="ghost key" id="pickbtn">🗺 选关</button>
    <button class="ghost" id="cnbtn"></button>
  </div>
  <div class="stat" id="startstat"></div>
</div>

<div class="layer" id="pickwrap">
  <h2>选一关开始</h2>
  <p>打到哪一关，哪一关就解锁。</p>
  <div id="pick"></div>
  <div class="row"><button class="ghost" id="pickback">返回</button></div>
</div>

<div class="layer" id="over">
  <h2 id="overtitle">这局结束</h2>
  <div class="stat" id="overstat"></div>
  <div class="row">
    <button id="again">再来一局</button>
    <button class="ghost key" id="pickbtn2">🗺 选关</button>
    <button class="ghost" id="back">回首页</button>
  </div>
</div>

<div class="layer" id="paused">
  <h2>⏸ 暂停</h2>
  <button id="resume">继续</button>
</div>

<script src="搬家逻辑.js?v=202611231709"></script>
<script>
/* =====================================================================
   大象搬家 · 介词拖放
   "Put the cat under the bed." —— 手指把小猫拖到床底下。

   为什么是拖放不是选择题：in / on / under 本来就是空间关系，拖到位置上
   这件事本身就是答案。选择题考「认得这个词」，拖放考「知道它在哪儿」。

   出题、可放点的几何、判对错都在 搬家逻辑.js（有测试：搬家测试.js），
   这一份只管画面、手感和声音。
   ===================================================================== */

const L = window.MoveLogic;
const SAVE_KEY = "move-game-v1";

let save = {};
try { save = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}"); } catch (e) { save = {}; }
save.best = save.best || 0;
save.solved = save.solved || 0;
save.unlocked = Math.max(1, Math.min(L.MAX_LEVEL, save.unlocked || 1));
if (save.cn === undefined) save.cn = true;        // 显示中文提示
save.stats = save.stats || {};                   // 每个介词的对错次数，用来决定多出哪个
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

/* ---------------- 画布 ---------------- */

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1, bgGrad = null;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.clientWidth; H = cv.clientHeight;
  while (W * DPR * H * DPR > 2400000 && DPR > 1) DPR -= .25;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, "#1b4772"); bgGrad.addColorStop(1, "#2e74a8");   // 原来太暗，家具都看不清
  if (S.task) relayout();                      // 转屏之后家具要重新摆
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));

/* ---------------- 声音 ---------------- */

let AC = null;
function audio() {
  if (AC) return AC;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  return AC;
}
function tone(freq, dur, type, vol) {
  const ac = audio(); if (!ac) return;
  if (ac.state === "suspended") ac.resume();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || .12, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
const sndGood = n => { tone(520 + n * 40, .12, "triangle", .14); setTimeout(() => tone(780 + n * 50, .16, "triangle", .12), 90); };
const sndBad  = () => { tone(220, .2, "sawtooth", .09); setTimeout(() => tone(160, .24, "sawtooth", .08), 110); };
const sndPick = () => tone(660, .06, "sine", .07);
function sndFanfare() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .16, "triangle", .13), i * 110));
  setTimeout(() => tone(1319, .5, "triangle", .11), 470);
}

/* ---------------- 朗读 ----------------
   这一页的朗读不是装饰：题目本身就是一句英语，听懂了才知道往哪儿放。
   iOS 的两道闸和接答案那边一样——第一次必须在手势里开，cancel 之后要隔一帧。 */

let voices = [], speechReady = false;
function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch (e) { voices = []; } }
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice() {
  const en = voices.filter(v => /^en/i.test(v.lang || ""));
  const female = en.filter(v => /samantha|karen|zira|aria|jenny|moira|tessa|female|woman/i.test(v.name || ""));
  const us = en.filter(v => /^en[-_]US/i.test(v.lang || ""));
  return female[0] || us[0] || en[0] || null;
}
function unlockSpeech() {
  if (speechReady || !window.speechSynthesis) return;
  speechReady = true;
  try { loadVoices(); const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch (e) {}
}
function sayNow(text, rate) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) u.voice = v;
    u.lang = (v && v.lang) || "en-US";
    u.rate = rate || .92;                 // 题目要听清楚，比夸奖慢一点
    u.pitch = 1.1;
    speechSynthesis.speak(u);
  } catch (e) {}
}
function say(text, rate) {
  if (!window.speechSynthesis) return;
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    try { speechSynthesis.cancel(); } catch (e) {}
    setTimeout(() => sayNow(text, rate), 60);
    return;
  }
  sayNow(text, rate);
}
const PRAISE = ["Great job!", "Well done!", "Perfect!", "Nice one!", "Exactly!", "Brilliant!", "You got it!", "Awesome!"];
const said = [];
function praise() {
  const fresh = PRAISE.filter(x => said.indexOf(x) < 0);
  const w = (fresh.length ? fresh : PRAISE)[Math.random() * (fresh.length || PRAISE.length) | 0];
  said.push(w); while (said.length > 4) said.shift();
  say(w, 1);
  return w;
}

/* ---------------- 状态 ---------------- */

const S = {
  mode: "ready",
  g: L.newGame(),
  task: null, lay: null, spots: null,
  item: null,              // 正在拖的东西 {x, y, ox, oy, grab, home}
  placed: [],              // 已经放好的（上一题留在场上的，淡出用）
  parts: [], floats: [],
  tell: null,              // 答错时的解说：{wrong, right, t}
  retry: [], wrongLog: [],
  shake: 0, flashGold: 0,
  prevBest: 0, brokeRecord: false, endless: false,
  t: 0,
};

const $ = id => document.getElementById(id);
const layer = (id, on) => $(id).classList.toggle("show", on);
const HEAD = () => Math.max(132, H * .2);
const FOOT = () => Math.max(112, H * .16);

/* ---------------- 一轮 ---------------- */

function relayout() {
  S.lay = L.layoutFor(W, H, HEAD() + 10, H - FOOT() - 10);
  S.spots = L.spots(S.lay, L.STAGES[L.stageOf(L.levelFor(S.g.solved)).index].preps,
                    S.task ? S.task.anchors : null);
  if (!S.item) return;
  S.item.home = { x: W / 2, y: H - FOOT() / 2 };
  if (S.item.placed && S.item.spot) {
    // 已经摆好的东西要跟着它那个位置走，不能一转屏就掉回底下——
    // 「东西已经摆好、问它在哪儿」那种题，掉回底下等于题面没了
    const sp = S.spots.find(x => x.prep === S.item.spot.prep && x.ai === S.item.spot.ai);
    if (sp) { S.item.spot = sp; S.item.x = sp.x; S.item.y = sp.y; }
  } else if (!S.item.drag) {
    S.item.x = S.item.home.x; S.item.y = S.item.home.y;
  }
}

function newTask() {
  // 结算已经盖上来了就别再出新题：选项条会跟着冒出来，浮在结算页上点都点不掉
  if (S.mode !== "play") { hideChoices(); return; }
  const lv = L.levelFor(S.g.solved);
  const due = S.retry.length && S.t >= S.retry[0].at ? S.retry.shift() : null;
  S.task = due ? due.task : L.makeTask(lv, Math.random, save.stats);
  S.task.again = !!due;
  relayout();
  S.item = { x: W / 2, y: H - FOOT() / 2, home: { x: W / 2, y: H - FOOT() / 2 }, drag: false, scale: 1 };
  S.tell = null;

  if (S.task.kind === "ask") {
    // 反过来问：东西已经摆好了，让人说出它在哪儿
    const spot = S.spots.find(s => s.prep === S.task.prep &&
                 (S.task.prep === "between" || s.ai === S.task.ai));
    S.item.x = spot.x; S.item.y = spot.y; S.item.placed = 1; S.item.spot = spot;
    showChoices();
    say(S.task.q);
  } else {
    hideChoices();
    say(S.task.en);         // 题目念一遍。念完才好动手，所以 item 一直在那儿等
  }
}

// 每个介词记一笔对错：下次出题会多出错得多的那个
function note(prep, ok) {
  const st = save.stats[prep] || (save.stats[prep] = { right: 0, wrong: 0 });
  st[ok ? "right" : "wrong"] += 1;
}

function drop(x, y) {
  const r = L.judge(S.spots, x, y, S.task);
  if (r.miss) {                       // 放在空地上：不算错，弹回去重来
    S.item.x = S.item.home.x; S.item.y = S.item.home.y;
    return;
  }
  if (r.ok) {
    S.item.x = r.spot.x; S.item.y = r.spot.y; S.item.drag = false; S.item.placed = 1; S.item.spot = r.spot;
    rewardRight(r.spot.x, r.spot.y);
    if (!S.endless && L.isCleared(S.g.solved)) return;     // 通关了，rewardRight 里已经安排好
    setTimeout(newTask, 1100);
  } else {
    penalize();
    // 讲清楚：你放的地方是「on the box」，要放的是「under the box」
    S.tell = { wrong: r.spot, right: S.spots.find(s => s.prep === S.task.prep &&
                 (S.task.prep === "between" || s.ai === S.task.ai)), t: 2.6 };
    S.item.x = S.item.home.x; S.item.y = S.item.home.y;
    say(phraseOf(S.task.prep, S.task), 1);
    // 讲完就换下一题。原来放错之后停在原题不动，看上去就是「一直在重复同一道」——
    // 这题已经排进补考队列了，过一会儿自然会再见面
    setTimeout(newTask, 2700);
  }
}

/* 答对了：加分、撒花、夸一句、该升级就升级。拖对和选对走的是同一套，
   不然两种题型的手感会慢慢长歪。 */
function rewardRight(x, y) {
  const lv = L.levelFor(S.g.solved);
  const gain = L.hitScore(S.g.combo + 1, lv);
  L.right(S.g, lv);
  note(S.task.prep, true);
  save.solved = (save.solved || 0) + 1;
  burst(x, y, "#ffd166", 24);
  float(x, y - 46, "+" + gain, "#ffd166", 28);
  sndGood(Math.min(S.g.combo, 6));
  float(W / 2, HEAD() + 54, praise(), "#9ef0c8", 30);

  if (!S.brokeRecord && S.prevBest > 0 && S.g.score >= S.prevBest) {
    S.brokeRecord = true; confetti(90); sndFanfare(); S.flashGold = 1;
    float(W / 2, H * .42, "NEW RECORD!", "#ffd166", 34);
  }
  const before = L.levelFor(S.g.solved - 1), now = L.levelFor(S.g.solved);
  if (now > before) {
    save.unlocked = Math.max(save.unlocked, now);
    float(W / 2, HEAD() + 96, "第 " + now + " 关 · " + L.stageOf(now).name, "#fff", 22);
    sndFanfare();
  }
  persist();
  if (!S.endless && L.isCleared(S.g.solved)) { hideChoices(); setTimeout(victory, 900); }
}

/* 答错了：不扣心，只断连击，并把这题排进补考队列 */
function penalize() {
  L.wrong(S.g);
  note(S.task.prep, false);
  persist();
  sndBad();
  S.shake = 1;
  S.retry.push({ task: S.task, at: S.t + 25 });
  if (!S.wrongLog.some(w => w.en === (S.task.en || S.task.q))) {
    S.wrongLog.push({ en: S.task.kind === "ask" ? S.task.q + " → " + S.task.choices[S.task.answer] : S.task.en });
  }
}

// "under the bed" / "between the box and the tree"
function phraseOf(prep, task) {
  return prep === "between"
    ? "between the " + task.anchors[0].en + " and the " + task.anchors[1].en
    : prep + " the " + task.anchors[task.ai].en;
}
function phraseOfSpot(spot, task) {
  return spot.prep === "between"
    ? "between the " + task.anchors[0].en + " and the " + task.anchors[1].en
    : spot.prep + " the " + task.anchors[spot.ai].en;
}

/* ---------------- 特效 ---------------- */

const CONFETTI = ["#ffd166", "#ff9f45", "#5ad2a0", "#53c4ef", "#ff7a9c", "#fff"];
const MAX_PARTS = 240;
function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.28, sp = 80 + Math.random() * 220;
    S.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 50, r: 2 + Math.random() * 4,
                   life: .5 + Math.random() * .5, color });
  }
}
function confetti(n) {
  for (let i = 0; i < n; i++) {
    S.parts.push({ x: Math.random() * W, y: -10 - Math.random() * H * .3,
      vx: (Math.random() - .5) * 120, vy: 60 + Math.random() * 120, r: 3 + Math.random() * 4,
      life: 1.6 + Math.random() * 1.2, color: CONFETTI[Math.random() * CONFETTI.length | 0],
      flake: 1, spin: (Math.random() - .5) * 12, rot: Math.random() * 6.3 });
  }
}
function float(x, y, text, color, size) { S.floats.push({ x, y, text, color, size: size || 24, life: 1.3 }); }

/* ---------------- 每帧 ---------------- */

let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000 || 0);
  last = now;
  if (S.mode === "play") step(dt);
  draw();
}

function step(dt) {
  S.t += dt;
  S.shake = Math.max(0, S.shake - dt * 2.6);
  if (S.flashGold) S.flashGold = Math.max(0, S.flashGold - dt * 1.6);
  if (S.tell) { S.tell.t -= dt; if (S.tell.t <= 0) S.tell = null; }
  S.parts.forEach(p => {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += (p.flake ? 160 : 900) * dt;
    if (p.flake) { p.rot += p.spin * dt; p.vx *= (1 - dt * .6); }
  });
  S.parts = S.parts.filter(p => p.life > 0);
  if (S.parts.length > MAX_PARTS) S.parts.splice(0, S.parts.length - MAX_PARTS);
  S.floats.forEach(f => { f.life -= dt; f.y -= dt * 34; });
  S.floats = S.floats.filter(f => f.life > 0);
  if (S.item && !S.item.drag && !S.item.placed) {
    // 弹回原位：不是瞬移，弹一下才看得出「没放成」
    S.item.x += (S.item.home.x - S.item.x) * Math.min(1, dt * 12);
    S.item.y += (S.item.home.y - S.item.y) * Math.min(1, dt * 12);
  }
}

/* 画一个 emoji。
   这里每次都把 fillStyle 和 globalAlpha 掰回不透明，看着多余，其实是在修
   「手机上东西是半透明的」那个毛病：画 emoji 之前刚画过柔光，fillStyle 还是
   一个边缘透明的径向渐变。彩色 emoji 不吃 fillStyle，但只要系统有一个字形
   走了单色回退（🛏️ 这种带变体选择符的最容易），它就会用当前这个渐变去涂，
   于是那个东西看着就是透明的——而桌面浏览器上一切正常，很难想到这儿。 */
/* 要搬的东西。它是主角，任何时候都画成实的：
   原来待命时给了 0.9 的透明度想做「轻飘飘」的感觉，iPad 上看起来就是
   「这个东西是半透明的」，像还没加载完。要轻盈感改用上下浮动就够了。 */
function drawItem(anchorH) {
  const it = S.item;
  if (!it) return;
  const base = Math.max(52, anchorH * 1.9);
  // 放到「后面」的画小、放到「前面」的画大：远小近大，这是画面上唯一
  // 能表达前后的办法
  const depth = it.placed && it.spot ? it.spot.depth : 0;
  const size = base * (it.drag ? 1.2 : 1) * (depth === -1 ? .72 : depth === 1 ? 1.12 : 1);
  const y = (!it.drag && !it.placed) ? it.y + Math.sin(S.t * 2.4) * 4 : it.y;
  ctx.globalAlpha = 1;
  const gl = ctx.createRadialGradient(it.x, y, size * .1, it.x, y, size * .85);
  gl.addColorStop(0, "rgba(255,255,255,.26)");
  gl.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = gl;
  ctx.beginPath(); ctx.arc(it.x, y, size * .85, 0, 6.3); ctx.fill();
  emoji(S.task.item.emoji, it.x, y, size);
}

function emoji(ch, x, y, size, alpha) {
  ctx.font = size + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  /* 这里显式设定不透明度和颜色，是在修「手机上东西是半透明的」那个毛病：
     画之前可能刚画过柔光，fillStyle 还留着一个边缘透明的渐变。彩色 emoji 不吃
     fillStyle，但只要有字形走了单色回退，它就会拿那个渐变去涂。
     要画淡的（虚影）就从这儿传 alpha 进来——在外面设 globalAlpha 会被这行盖掉。 */
  ctx.globalAlpha = alpha == null ? 1 : alpha;
  ctx.fillStyle = "#fff";
  ctx.fillText(ch, x, y);
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.save();
  if (S.shake > 0) { const k = S.shake * 9; ctx.translate((Math.random() - .5) * k, (Math.random() - .5) * k); }
  ctx.fillStyle = bgGrad || "#15314f";
  ctx.fillRect(-20, -20, W + 40, H + 40);

  if (S.mode === "play" || S.mode === "pause") {
    ctx.globalAlpha = 1;                  // 上一帧的粒子可能把它改过，这里归位
    const floor = H - FOOT() - 10;
    ctx.fillStyle = "rgba(255,255,255,.1)";
    ctx.fillRect(-20, floor, W + 40, H);

    // 可以放的位置：画成虚线圈。知道有哪些位置可放，难点才落在「选哪个」上
    /* 每个位置上画一个「虚影」——就是这件东西放在那儿会长什么样：
       放到后面的虚影小、而且等一会儿会被家具挡住一截；放到前面的虚影大、
       压在家具身上。圈和示意图都试过，最后发现都不如直接把结果画出来：
       孩子不用去理解我们的画法，看见哪个虚影是自己想要的，拖过去就行。 */
    const drawSpot = s => {
      const target = S.tell && S.tell.right === s;
      const bad = S.tell && S.tell.wrong === s;
      // 正拖着的时候，离手指最近的那个亮起来——拖的过程中就知道会放进哪儿
      const near = S.item && S.item.drag &&
                   L.hit(S.spots, S.item.x, S.item.y) === s;
      // 虚影画小一号（真放上去会更大）：画成实物大小会把家具整个盖住，
      // 满屏都是同一只小狗，反而看不出场景了
      const size = s.r * 1.6 * (s.depth === -1 ? .82 : s.depth === 1 ? 1.12 : 1);

      // 平时很淡，只是告诉你「这儿能放」；手指拖近了才亮起来
      emoji(S.task.item.emoji, s.x, s.y, size,
            target ? .95 : bad ? .55 : near ? .85 : .22);

      ctx.save();
      ctx.setLineDash(target || bad || near ? [] : [5, 6]);
      ctx.lineWidth = target || bad || near ? 3 : 1.5;
      ctx.strokeStyle = target ? "#5ad2a0" : bad ? "#ff7a9c" : near ? "#ffd166" : "rgba(255,255,255,.3)";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 1.15, 0, 6.3); ctx.stroke();
      ctx.restore();
      if (target || bad) {
        ctx.fillStyle = target ? "#5ad2a0" : "#ff7a9c";
        ctx.font = "700 13px system-ui,-apple-system,sans-serif";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText((target ? "✓ " : "✗ ") + s.prep, s.x, s.y + s.r * 1.15 + 13);
      }
    };

    // 远处的（后面）先画，这样等会儿家具会把它挡住一截——
    // 「挡住 = 在后面」，这件事不用翻译
    S.spots.filter(s => s.depth === -1).forEach(drawSpot);
    // 东西要是放在「后面」，就得先画它，再画家具——被挡住才叫后面
    const placedBehind = S.item && S.item.placed && S.item.spot && S.item.spot.depth === -1;
    if (placedBehind) drawItem(S.lay[0].h);

    // 家具：底下垫一圈柔光，emoji 才不会糊在深色背景里
    S.lay.forEach((a, i) => {
      const g = ctx.createRadialGradient(a.x, a.y, a.h * .2, a.x, a.y, a.h * 1.6);
      g.addColorStop(0, "rgba(255,255,255,.22)");
      g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(a.x, a.y, a.h * 1.6, 0, 6.3); ctx.fill();
      emoji(S.task.anchors[i].emoji, a.x, a.y, a.h * 2.2);
    });

    // 其余的（含「前面」）画在家具之后：压在家具身上，看着就在前面
    S.spots.filter(s => s.depth !== -1).forEach(drawSpot);

    /* 家具叫什么，写在地板线上当图例：
       原来写在家具正下方，正好压在「under」那个圈上，看着像那个圈的标签 */
    ctx.font = "600 13px system-ui,-apple-system,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(255,255,255,.62)";
    const legend = S.task.anchors.map(a => a.emoji + " " + a.en).join("   ");
    ctx.fillText(legend, W / 2, floor + 18);

    if (!placedBehind) drawItem(S.lay[0].h);
  }

  // 粒子
  S.parts.forEach(p => {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = p.color;
    if (p.flake) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.r, -p.r * .5, p.r * 2, Math.max(1.2, p.r * Math.abs(Math.cos(p.rot))));
      ctx.restore();
    } else { ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.3); ctx.fill(); }
  });
  ctx.globalAlpha = 1;

  S.floats.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.life * 1.4);
    ctx.fillStyle = f.color;
    ctx.font = "800 " + f.size + "px system-ui,-apple-system,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;

  if (S.flashGold) {
    ctx.fillStyle = "rgba(255,209,102," + (S.flashGold * .32) + ")";
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }
  ctx.restore();

  if (S.mode === "play" || S.mode === "pause") drawHud();
}

function drawHud() {
  const hb = HEAD();
  ctx.fillStyle = "#0b2338";
  ctx.fillRect(-20, -20, W + 40, hb + 20);
  ctx.fillStyle = "rgba(255,255,255,.08)";
  ctx.fillRect(-20, hb, W + 40, 2);

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  // 题目：介词用亮色标出来，眼睛一下就抓到要点
  const t = S.task;
  // 句子长短差很多（"Put the cat in the box." 和
  // "Put the teddy between the basket and the house."），字号得按量出来的宽度缩
  let size = Math.round(Math.min(27, W / 15));
  const fontOf = n => "800 " + n + "px system-ui,-apple-system,sans-serif";
  ctx.font = fontOf(size);
  const full = ctx.measureText(t.kind === "ask" ? t.q : t.en).width;
  const room = W - 32;
  if (full > room) { size = Math.max(14, Math.floor(size * room / full)); }
  ctx.font = fontOf(size);
  // 问答题显示的是问句；而且不能把介词标出来——那就是答案
  const line = t.kind === "ask" ? t.q : t.en;
  const prep = t.kind === "ask" ? "\u0000" : t.prep;
  const parts = line.split(new RegExp("(" + prep.replace(/ /g, "\\s") + ")"));
  const widths = parts.map(p => ctx.measureText(p).width);
  let x = W / 2 - widths.reduce((a, b) => a + b, 0) / 2;
  const y = hb - (save.cn ? 62 : 48);
  parts.forEach((p, i) => {
    ctx.fillStyle = p === prep ? "#ffd166" : "#fff";
    ctx.textAlign = "left";
    ctx.fillText(p, x, y);
    x += widths[i];
  });
  ctx.textAlign = "center";
  if (save.cn) {
    ctx.fillStyle = "rgba(255,255,255,.62)";
    ctx.font = "500 14px system-ui,-apple-system,sans-serif";
    ctx.fillText(t.kind === "ask" ? t.qcn : t.cn, W / 2, hb - 36);
  }
  if (t.again) {
    ctx.fillStyle = "#ff9f45";
    ctx.font = "700 12px system-ui,-apple-system,sans-serif";
    ctx.fillText("↻ 刚才放错的那题", W / 2, 22);
  }

  const lv = L.levelFor(S.g.solved);
  ctx.font = "600 13px system-ui,-apple-system,sans-serif";
  ctx.fillStyle = "rgba(255,255,255,.72)";
  ctx.textAlign = "left";
  ctx.fillText(S.endless ? "♾ 无尽" : "第 " + lv + " 关 · 还差 " + L.leftToClear(S.g.solved) + " 题通关", 16, hb - 14);
  ctx.textAlign = "right";
  ctx.fillText(S.g.score + " 分" + (S.g.combo >= 2 ? "　🔥" + S.g.combo : ""), W - 16, hb - 14);
}

/* ---------------- 反过来问：四个短语选一个 ---------------- */

function hideChoices() { $("choices").classList.remove("show"); $("choices").innerHTML = ""; }

function showChoices() {
  const box = $("choices");
  box.innerHTML = S.task.choices.map((c, i) => '<button data-i="' + i + '">' + c + "</button>").join("");
  box.classList.add("show");
  box.querySelectorAll("button").forEach(b => {
    b.onclick = () => answerChoice(+b.dataset.i, b);
  });
}

function answerChoice(i, btn) {
  if (S.mode !== "play" || !S.task || S.task.done) return;
  S.task.done = 1;
  const ok = i === S.task.answer;
  const box = $("choices");
  box.querySelectorAll("button").forEach((b, k) => {
    if (k === S.task.answer) b.classList.add("right");
    else if (k === i) b.classList.add("wrongpick");
    b.disabled = true;
  });
  if (ok) {
    rewardRight(S.item.x, S.item.y);
    // 通关了就交给 victory()，别再排下一题——那会把选项条铺到结算页上
    if (!S.endless && L.isCleared(S.g.solved)) return;
    setTimeout(() => { hideChoices(); newTask(); }, 1100);
  } else {
    penalize();
    say(S.task.choices[S.task.answer], 1);
    setTimeout(() => { hideChoices(); newTask(); }, 2400);
  }
}

/* ---------------- 手指 ---------------- */

function pointAt(e) { return { x: e.clientX, y: e.clientY }; }

cv.addEventListener("pointerdown", e => {
  audio(); unlockSpeech();
  if (S.mode !== "play" || !S.item || S.item.placed) return;
  const p = pointAt(e);
  const size = Math.max(52, S.lay[0].h * 1.9);
  // 抓的范围比图标大一圈：手指按在边上也该抓得起来
  if (Math.hypot(p.x - S.item.x, p.y - S.item.y) > size) return;
  S.item.drag = true;
  cv.setPointerCapture(e.pointerId);
  sndPick();
});
cv.addEventListener("pointermove", e => {
  if (!S.item || !S.item.drag) return;
  const p = pointAt(e);
  S.item.x = p.x;
  S.item.y = p.y - 26;        // 往上抬一点，手指不挡着图标
});
cv.addEventListener("pointerup", e => {
  if (!S.item || !S.item.drag) return;
  S.item.drag = false;
  drop(S.item.x, S.item.y);
});
cv.addEventListener("pointercancel", () => { if (S.item) S.item.drag = false; });

/* ---------------- 开局 / 结算 ---------------- */

function start(fromLevel) {
  S.g = L.newGame();
  if (fromLevel > 1) S.g.solved = (Math.min(L.MAX_LEVEL, fromLevel) - 1) * L.PER_LEVEL;
  S.parts = []; S.floats = []; S.retry = []; S.wrongLog = [];
  S.prevBest = save.best || 0; S.brokeRecord = false; S.flashGold = 0; S.endless = false;
  S.t = 0;
  S.mode = "play";
  document.body.classList.add("playing");
  layer("start", false); layer("over", false); layer("paused", false); layer("pickwrap", false);
  $("saybtn").style.display = "";
  refreshHome();
  audio(); unlockSpeech();
  newTask();
}

function finish(title, cleared) {
  S.mode = "over";
  document.body.classList.remove("playing");
  $("saybtn").style.display = "none";
  hideChoices();
  if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
  const prevBest = save.best || 0;
  const isBest = S.g.score > prevBest && S.g.score > 0;
  save.best = Math.max(prevBest, S.g.score);
  save.bestCombo = Math.max(save.bestCombo || 0, S.g.bestCombo);
  if (cleared) save.cleared = (save.cleared || 0) + 1;
  persist();
  if (isBest && !S.brokeRecord) { confetti(70); sndFanfare(); }
  $("overtitle").textContent = title;
  $("overstat").innerHTML =
    '<div class="big">' + S.g.score + " 分</div>" +
    '<div class="combo">🔥 最长连对 <em>' + S.g.bestCombo + "</em> 题</div>" +
    "放对 <em>" + S.g.solved + "</em> 题　放错 <em>" + S.g.wrong + "</em> 次<br>" +
    "最高分 <em>" + save.best + "</em>" + (save.cleared ? "　🏁 已通关 <em>" + save.cleared + "</em> 次" : "") +
    (S.wrongLog.length
      ? '<div class="wrongs"><b>这几句再看一眼：</b>' +
        S.wrongLog.slice(0, 5).map(x => "<span>" + x.en + "</span>").join("") +
        (L.weakest(save.stats) ? "<br><b style=\"margin-top:6px\">下一局会多练 " +
          L.weakest(save.stats) + "（" + L.PREPS[L.weakest(save.stats)].cn + "）</b>" : "") + "</div>"
      : "");
  setTimeout(() => { layer("over", true); refreshHome(); }, cleared ? 1000 : 500);
}

function victory() { confetti(160); sndFanfare(); setTimeout(sndFanfare, 600); S.flashGold = 1; finish("🎉 通关啦！", true); }

/* ---------------- 界面 ---------------- */

/* 选关：现在一个阶段就是一关，总共三关。
   原来沿用的是接答案那边的两列网格，一行只有一个按钮时它会缩在左半边，
   看着整块往左偏。三关一共就三行，直接排成一列整行按钮，顺手把这一关
   练什么写在按钮上。 */
function renderPick() {
  let h = "";
  L.STAGES.forEach((st, si) => {
    const lv = si + 1;
    const open = lv <= save.unlocked;
    h += '<button class="lv' + (open ? (lv === save.unlocked ? " on" : "") : " lock") + '"' +
         (open ? ' data-lv="' + lv + '"' : " disabled") + ">" +
         (open ? "第 " + lv + " 关" : "🔒 第 " + lv + " 关") +
         '<span class="sub">' + st.name + "</span></button>";
  });
  $("pick").innerHTML = h;
  $("pick").querySelectorAll("button.lv[data-lv]").forEach(b => { b.onclick = () => start(+b.dataset.lv); });
}
function openPick() { renderPick(); layer("start", false); layer("over", false); layer("pickwrap", true); refreshHome(); }

function refreshCn() { $("cnbtn").textContent = save.cn ? "🀄 中文提示：开" : "🀄 中文提示：关"; }
function refreshStart() {
  refreshCn();
  const un = save.unlocked || 1;
  const weak = L.weakest(save.stats);
  $("startstat").innerHTML =
    (un > 1 ? "从 <em>第 " + un + " 关 · " + L.stageOf(un).name + "</em> 接着打<br>" : "") +
    (save.best ? "最高分 <em>" + save.best + "</em>　累计放对 <em>" + (save.solved || 0) + "</em> 题" : "") +
    (save.cleared ? "<br>🏁 已通关 <em>" + save.cleared + "</em> 次" : "") +
    (weak ? '<br>最该练的是 <em>' + weak + "</em>（" + L.PREPS[weak].cn + "），这一局会多出几次" : "");
}
function refreshHome() {
  const inGame = S.mode === "play" || S.mode === "pause" || S.mode === "over" ||
                 $("pickwrap").classList.contains("show");
  $("homebtn").textContent = inGame ? "‹ 返回" : "‹ 回首页";
}
function goBack() {
  if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
  if (S.mode === "play" || S.mode === "pause" || S.mode === "over") {
    S.mode = "ready";
    document.body.classList.remove("playing");
    S.parts = []; S.floats = [];
    $("saybtn").style.display = "none";
    hideChoices();
    layer("paused", false); layer("over", false); layer("pickwrap", false); layer("start", true);
    refreshStart(); refreshHome();
    return;
  }
  if ($("pickwrap").classList.contains("show")) {
    layer("pickwrap", false); layer("start", true); refreshStart(); refreshHome();
    return;
  }
  location.href = "index.html";
}

$("go").onclick = () => start(save.unlocked || 1);
$("again").onclick = () => start(L.levelFor(S.g.solved));
$("pickbtn").onclick = openPick;
$("pickbtn2").onclick = openPick;
$("pickback").onclick = () => { layer("pickwrap", false); layer("start", true); refreshStart(); refreshHome(); };
$("back").onclick = () => { location.href = "index.html"; };
$("homebtn").onclick = goBack;
$("saybtn").onclick = () => { unlockSpeech(); if (S.task) say(S.task.kind === "ask" ? S.task.q : S.task.en); };
$("cnbtn").onclick = () => { save.cn = !save.cn; persist(); refreshCn(); };
function pause() { S.mode = "pause"; layer("paused", true); hideChoices(); }
function resume() {
  S.mode = "play";
  layer("paused", false);
  // 暂停时把选项收了，回来要按需放回去——不然问答题变成只能看着
  if (S.task && S.task.kind === "ask" && !S.task.done) showChoices();
}
$("pausebtn").onclick = () => { S.mode === "play" ? pause() : S.mode === "pause" && resume(); };
$("resume").onclick = resume;
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && S.mode === "play") {
    pause();
    if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
  }
});

resize();
refreshStart();
refreshHome();
requestAnimationFrame(frame);
</script>
