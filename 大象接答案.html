<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>大象接答案 · 口算小游戏</title>
<link rel="icon" href="favicon.svg?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<style>
  /* 这一页是游戏，不是文档：整屏固定、不滚动、不回弹，手指只用来操作大象 */
  html,body{margin:0;height:100%;overflow:hidden;background:#0d5f4c;
    overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
    font:16px/1.6 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:#fff}
  canvas{display:block;width:100%;height:100%}

  /* 盖在画布上的几层：开始、结算、暂停。画面用 canvas，文字和按钮用 DOM——
     canvas 里排中文太难调，DOM 还能直接用系统字体和安全区 */
  .layer{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:calc(env(safe-area-inset-top) + 20px) 22px calc(env(safe-area-inset-bottom) + 20px);
    background:rgba(8,54,44,.82);backdrop-filter:blur(3px)}
  .layer.show{display:flex}
  .layer h1{font-size:30px;margin:0 0 6px}
  .layer h2{font-size:23px;margin:0 0 10px}
  .layer p{margin:0 0 14px;font-size:15px;color:#cfe9e0;max-width:19em;line-height:1.9}
  .layer b{color:#ffd166}
  /* 只管自己弹层里的按钮：同步面板也是 <button>，不加这层限定会被染成黄色 */
  .layer button{font-family:inherit;font-size:19px;font-weight:700;padding:14px 34px;border-radius:99px;
    border:none;background:#ffd166;color:#0d5f4c;cursor:pointer;box-shadow:0 6px 0 #d9a93f;
    transition:transform .08s,box-shadow .08s}
  .layer button:active{transform:translateY(4px);box-shadow:0 2px 0 #d9a93f}
  .layer button.ghost{background:transparent;color:#cfe9e0;box-shadow:none;font-size:15px;font-weight:500;padding:10px 18px}
  .layer button.ghost:active{transform:none}
  /* 「选关」原来跟「返回」一样是淡淡的一行字，混在背景里看不见。
     给它描一圈黄边、加点底色，做成看得出来能按的胶囊。 */
  .layer button.ghost.key{border:2px solid #ffd166;background:rgba(255,209,102,.14);
    color:#ffd166;font-size:17px;font-weight:700;padding:11px 26px}
  .layer button.ghost.key:active{transform:scale(.97)}
  .row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;justify-content:center}
  .stat{font-size:15px;color:#cfe9e0;margin-top:10px;line-height:2}
  .stat em{font-style:normal;color:#fff;font-weight:700;font-size:17px}
  /* 结算页：分数和最长连对是这局的主角，其余的缩成一行小字 */
  .stat .big{font-size:40px;font-weight:800;color:#ffd166;line-height:1.3}
  .stat .combo{font-size:17px;color:#fff;margin:2px 0 8px}
  .stat .combo em{color:#ff9f45;font-size:20px}
  /* 结算页的错题：这局唯一「学到东西」的部分，给它一块地方，别混在数字里 */
  .stat .wrongs{margin-top:12px;background:rgba(255,255,255,.08);border-radius:12px;
    padding:10px 12px;font-size:14px;color:#cfe9e0;text-align:left;line-height:1.9}
  .stat .wrongs b{display:block;color:#ffd166;font-size:13px;margin-bottom:4px}
  .stat .wrongs span{display:inline-block;background:rgba(0,0,0,.18);border-radius:8px;
    padding:2px 9px;margin:2px 5px 2px 0;color:#fff;font-weight:600}
  .home{font-family:inherit;border:none;cursor:pointer;position:fixed;left:calc(env(safe-area-inset-left) + 10px);top:calc(env(safe-area-inset-top) + 10px);
    z-index:5;color:rgba(255,255,255,.75);text-decoration:none;font-size:14px;
    background:rgba(0,0,0,.18);padding:6px 12px;border-radius:99px}
  #pausebtn{font-family:inherit;border:none;cursor:pointer;position:fixed;right:calc(env(safe-area-inset-right) + 10px);top:calc(env(safe-area-inset-top) + 10px);
    z-index:5;font-size:14px;font-weight:500;padding:6px 12px;background:rgba(0,0,0,.18);color:rgba(255,255,255,.75);
    box-shadow:none;border-radius:99px}
  #pausebtn:active{transform:none}
  /* 选关：一个阶段一行，锁住的也画出来——看得见「还有什么」才有奔头 */
  /* 三个格子铺满整行：原来是固定 84px 靠左排，窄屏上 340px 的框里只占
     268px，整块看着往左偏。改成等分网格，宽窄屏都是对称的 */
  #pick{max-height:52vh;overflow:auto;width:100%;max-width:330px;-webkit-overflow-scrolling:touch}
  #pick .st{font-size:13px;color:#9fc9bb;margin:12px 0 6px;text-align:left}
  #pick .lvrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  /* box-shadow 要显式关掉：.layer button 那条给所有按钮垫了一道黄色厚边，
     关卡格子套上去会变成一排立体砖块 */
  #pick .lv{width:100%;padding:10px 0;border-radius:12px;border:2px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.08);color:#fff;font-size:15px;font-weight:700;cursor:pointer;
    box-shadow:none;transform:none}
  #pick .lv:active{transform:scale(.96);box-shadow:none}
  #pick .lv.on{border-color:#ffd166;background:rgba(255,209,102,.18);color:#ffd166}
  #pick .lv.lock{opacity:.38;cursor:not-allowed}
  /* 没登录时，同步那个小圆点会一直做 box-shadow 呼吸动画——那是每帧重绘，
     和正在下落的球抢同一份时间。游戏进行中直接把它收起来，回到开始界面再出现 */
  body.playing #syncchip{display:none !important}
  @media (prefers-reduced-motion:reduce){ .layer button{transition:none} }
</style>
</head>
<body>

<canvas id="cv"></canvas>
<button class="home" id="homebtn">‹ 返回</button>
<button id="pausebtn">⏸</button>

<div class="layer show" id="start">
  <h1>🐘 大象接答案</h1>
  <p>天上掉数字，<b>按住屏幕左右拖</b>，让大象接住<b>算对的那个</b>。<br>
     接错掉一颗心，漏掉不扣心。<br>
     从 <b>20 以内加减</b> 开始，一路到九九乘法、凑整巧算、两步混合，<br>
     <b>答对 60 题</b>就通关。</p>
  <button id="go">开始</button>
  <div class="row">
    <button class="ghost key" id="pickbtn">🗺 选关</button>
    <button class="ghost" id="voicebtn"></button>
  </div>
  <div class="stat" id="startstat"></div>
</div>

<div class="layer" id="pickwrap">
  <h2>选一关开始</h2>
  <p>打到哪一关，哪一关就解锁。想复习前面的，随时点回去。</p>
  <div id="pick"></div>
  <div class="row"><button class="ghost" id="pickback">返回</button></div>
</div>

<div class="layer" id="over">
  <h2 id="overtitle">这局结束</h2>
  <div class="stat" id="overstat"></div>
  <div class="row">
    <button id="again">再来一局</button>
    <button class="ghost" id="endless" style="display:none">♾ 接着打</button>
    <button class="ghost key" id="pickbtn2">🗺 选关</button>
    <button class="ghost" id="back">回首页</button>
  </div>
</div>

<div class="layer" id="paused">
  <h2>⏸ 暂停</h2>
  <button id="resume">继续</button>
</div>

<script src="接答案逻辑.js?v=202611232202"></script>
<script>
/* =====================================================================
   大象接答案
   玩法一句话：天上掉数字，拖着大象去接算对的那个。

   这一份只管「看得见的部分」——画面、手感、音效。出题、判定、计分、
   难度曲线都在 接答案逻辑.js 里，那边有测试（接答案测试.js）。

   为什么用 canvas 而不是 DOM：几十个气球加粒子同时动，DOM 在 iPad 上
   会掉帧；canvas 一次画完稳在 60 帧。但文字按钮仍旧用 DOM——canvas 里
   排中文、处理安全区都太别扭。
   ===================================================================== */

const L = window.CatchLogic;
const SAVE_KEY = "catch-game-v1";

let save = {};
try { save = JSON.parse(localStorage.getItem(SAVE_KEY) || "{}"); } catch (e) { save = {}; }
save.best = save.best || 0;              // 最高分
save.solved = save.solved || 0;          // 累计答对多少题
save.plays = save.plays || 0;            // 玩过多少局
if (save.voice === undefined) save.voice = true;   // 接对时的语音鼓励
save.unlocked = L.unlockTo(save.unlocked || 1, 1);    // 解锁到第几关
const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} };

/* ---------------- 画布 ---------------- */

const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
let bgGrad = null, bandGrad = null;      // 渐变只在尺寸变了的时候重建

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);   // 超过 2 倍纯属烧电
  // 再按总像素数压一道：iPad Pro 竖屏 1024×1366 @2 是 560 万像素，
  // 整屏背景每帧都要填一遍，掉帧就是从这儿来的。大屏上降到 1.25 倍左右，
  // 字边缘几乎看不出差别，但每帧要填的像素少一半还多
  while (W * DPR * H * DPR > 2400000 && DPR > 1) DPR -= .25;
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, "#0b4d3e"); bgGrad.addColorStop(1, "#13795f");
  bandGrad = ctx.createLinearGradient(0, 0, 0, Math.max(124, H * .21));
  bandGrad.addColorStop(0, "#073a2f"); bandGrad.addColorStop(1, "#0a4d3e");
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));
resize();

/* ---------------- 声音（现合成，不下载任何文件） ---------------- */

let AC = null;
function audio() {
  if (AC) return AC;
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; }
  return AC;
}
function tone(freq, dur, type, vol) {
  const ac = audio(); if (!ac || save.mute) return;
  if (ac.state === "suspended") ac.resume();
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(vol || .12, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}
// 接对了是往上走的两声，接错是往下掉的一声——不用看屏幕也知道刚才对不对
const sndGood = n => { tone(520 + n * 40, .12, "triangle", .14); setTimeout(() => tone(780 + n * 50, .16, "triangle", .12), 90); };
const sndBad  = () => { tone(200, .22, "sawtooth", .1); setTimeout(() => tone(140, .26, "sawtooth", .09), 110); };
const sndMiss = () => tone(300, .1, "sine", .07);

/* ---------------- 夸一句 ----------------
   接对了来一句 Great job！挑的是系统里的英语女声：孩子更吃这一套，
   比纯音效更像「有人在旁边陪着玩」，而且夸的话本身就是几句简单英语。

   三件事是踩过才知道的：
   - 每次都要先 cancel()。连对的时候两句叠在一起会糊成一团，而且 iOS 上
     排队排久了会整个卡死不再出声
   - 声音列表是异步到的，onvoiceschanged 之后要重挑一次
   - 不是每次都夸：连着夸十句就成了背景噪音，反而没人听。平时七成概率，
     连对三次以上必夸 */

// 夸奖的句子和「别连着重样」的挑法在 接答案逻辑.js 里（那边有测试）

let voices = [];
function loadVoices() { try { voices = speechSynthesis.getVoices() || []; } catch (e) { voices = []; } }
if (window.speechSynthesis) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }

// 优先挑英语女声；挑不到就让系统自己看着办，别拿中文声去念英文——
// 那个腔调比不夸还糟
function pickVoice() {
  const en = voices.filter(v => /^en/i.test(v.lang || ""));
  const female = en.filter(v => /samantha|karen|zira|aria|jenny|moira|tessa|female|woman/i.test(v.name || ""));
  const us = en.filter(v => /^en[-_]US/i.test(v.lang || ""));
  return female[0] || us[0] || en[0] || null;
}

/* iOS 上朗读有两道闸，都踩过：
   1. 第一次 speak 必须发生在用户手势里，否则后面在定时器/动画里怎么叫都没声。
      所以点「开始」的时候先念一句音量为 0 的空话，把闸打开。
   2. cancel() 紧接着 speak()，在 iOS 上经常把刚排进去的那句一起吞掉。
      改成只在真的还在说话时才打断，而且打断后隔一帧再说。 */
let speechReady = false;
function unlockSpeech() {
  if (speechReady || !window.speechSynthesis) return;
  speechReady = true;
  try {
    loadVoices();                        // iOS 要等一次手势之后才给得出完整列表
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function say(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice();
    if (v) u.voice = v;
    u.lang = (v && v.lang) || "en-US";
    u.rate = 1;    u.pitch = 1.2;         // 别太快：这也是听力，得听得清
    speechSynthesis.speak(u);
  } catch (e) {}
}

function speakPraise(text, combo) {
  if (!save.voice || !window.speechSynthesis) return;
  if (combo < 3 && Math.random() > .7) return;       // 平时七成，连对必念
  if (!voices.length) loadVoices();                  // 列表可能刚刚才到
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    try { speechSynthesis.cancel(); } catch (e) {}
    setTimeout(() => say(text), 60);                 // 等打断落定，直接接着说会被吞
    return;
  }
  say(text);
}
const sndUp   = () => { [0, 90, 180].forEach((d, i) => setTimeout(() => tone(600 + i * 180, .14, "triangle", .12), d)); };

/* ---------------- 状态 ---------------- */

const S = {
  mode: "ready",          // ready | play | pause | over
  g: L.newGame(),
  round: null,            // 当前这道题
  items: [],              // 正在掉的数字
  parts: [],              // 粒子
  floats: [],             // 冒出来的 +15 / 答案提示
  pops: [],               // 接对时甩在屏幕中间的那句英文
  retry: [],              // 答错过的题，等会儿再问一遍
  prevBest: 0,            // 开局时的历史最高分，用来判断什么时候该炸彩带
  brokeRecord: false,
  endless: false,         // 通关之后选择「接着打」
  flashGold: 0,
  wrongLog: [],           // 这一局错过哪些题，结算时摊开给人看
  ele: { x: 0, target: 0, squash: 0, trunk: 0, blink: 0, hop: 0 },
  shake: 0,
  flash: null,            // 答错时糊在屏幕上的那一下
  nextRoundAt: 0,
  banner: null,           // 升级横幅
  t: 0,
};

const $ = id => document.getElementById(id);
const layer = (id, on) => $(id).classList.toggle("show", on);

/* ---------------- 一轮 ---------------- */

const GROUND = () => H - Math.max(96, H * .16);     // 大象站的那条线
const ITEM_R = () => Math.max(26, Math.min(40, W / 10));
const popFont = n => "900 " + n + 'px "Segoe UI",system-ui,-apple-system,sans-serif';
const SWAY = 4;        // 左右摇摆的幅度。再大就会吃掉球之间留好的最小间距

function newRound() {
  const lv = L.levelFor(S.g.solved);
  const r = ITEM_R();
  // 错过的题隔几轮再考一次：错完就过去了，等于没学到。
  // 不紧接着重问——刚看过答案，马上再问只是在抄
  const due = S.retry.length && S.t >= S.retry[0].at ? S.retry.shift() : null;
  // 能排几个球由屏幕说了算：排不下就少掉一个，宁可三个也不要挤成一排——
  // 挤在一起时，大象横着过去的路上会先撞到旁边那个错的
  const n = L.dropCount(lv, W, r);
  S.round = due ? L.reRound(due.q, due.ans, Math.random, n) : L.makeRound(lv, Math.random, n);
  S.round.again = !!due;
  const xs = L.lanes(n, W, r, Math.random);
  const ys = L.dropOffsets(n, r, Math.random);
  const secs = L.fallSecs(lv);
  S.items = S.round.drops.map((v, i) => ({
    v, r, x: xs[i], y: ys[i],
    vy: (GROUND() + r * 2) / secs,
    sway: Math.random() * 6.28, hue: 0, dead: 0, caught: 0,
  }));
  // 正确答案不画成特殊颜色（那就不用算了），颜色按位置轮着来
  S.items.forEach((it, i) => it.hue = [48, 14, 190, 330][i % 4]);
}

function resolve(ok, value) {
  if (ok) {
    const lvNow = L.levelFor(S.g.solved);
    const gain = L.hitScore(S.g.combo + 1, lvNow);
    L.catchRight(S.g, lvNow);
    sndGood(Math.min(S.g.combo, 6));
    const word = L.praisePhrase(S.g.combo);
    speakPraise(word, S.g.combo);
    pop(word, S.g.combo);                 // 同一句话：耳朵听到的和眼睛看到的对得上
    burst(S.ele.x, GROUND() - 30, "#ffd166", 26);
    float(S.ele.x, GROUND() - 70, "+" + gain, "#ffd166", 30);
    if (S.g.combo >= 3) float(S.ele.x, GROUND() - 110, "🔥 " + S.g.combo, "#ff9f45", 22);
    S.ele.hop = 1; S.ele.trunk = 1;

    /* 当场超过历史最高分：别等结算页才说。那会儿人已经输了，
       「新纪录」读起来像安慰奖；在还活着的时候炸一下，才是接着打的理由。 */
    if (!S.brokeRecord && S.prevBest > 0 && S.g.score >= S.prevBest) {
      S.brokeRecord = true;
      confetti(90);
      S.banner = { text: "🏆 破纪录了！", sub: "原来是 " + S.prevBest + " 分", t: 3, big: true };
      pop("NEW RECORD!", 9, H * .52);      // 往下挪一截：上面那条横幅正占着 .36 那一带
      sndFanfare();
      S.flashGold = 1;
    }
    // 到 60 题就算通关：有个明确的终点，最后一关才不像「永远打不完」
    if (!S.endless && L.isCleared(S.g.solved)) { victory(); return; }

    const before = L.levelFor(S.g.solved - 1), now = L.levelFor(S.g.solved);
    if (now > before) {
      // 升关必须说一声，但不该打断：横幅飘在上面，球照掉。
      // 换主题是件大事（题型整个变了），多给一点时间和一个副标题，
      // 并且把下一题推迟一会儿——让人把那行字看完
      const s0 = L.stageOf(before), s1 = L.stageOf(now);
      const newStage = s1.index > s0.index;
      const last = now === L.MAX_LEVEL;
      S.banner = newStage
        ? { text: "第 " + now + " 关 · " + s1.name, sub: "换新题型啦", t: 2.6, big: true }
        : last
          ? { text: "最后一关", sub: "再 " + L.leftToClear(S.g.solved) + " 题就通关", t: 2.4, big: true }
          : { text: "第 " + now + " 关", sub: "掉得更快了", t: 1.8, big: false };
      if (newStage) S.nextRoundAt += 1;
      // 打到哪一关就解锁哪一关，下次可以直接从这儿接着打
      const un = L.unlockTo(save.unlocked, now);
      if (un !== save.unlocked) { save.unlocked = un; persist(); }
      sndUp();
      if (newStage) setTimeout(() => sndUp(), 260);
    }
  } else {
    L.catchWrong(S.g);
    sndBad();
    // 排到 3 轮之后再考一遍（时间上大约二十秒），中间隔开才算记住
    S.retry.push({ q: S.round.q, ans: S.round.ans, at: S.t + 20 });
    if (!S.wrongLog.some(x => x.q === S.round.q)) S.wrongLog.push({ q: S.round.q, ans: S.round.ans });
    S.shake = 1;
    S.flash = .5;
    S.ele.squash = 1;
    float(W / 2, H * .42, "正确答案是 " + S.round.ans, "#fff", 34);
  }
  save.solved = (save.solved || 0) + (ok ? 1 : 0);
  S.nextRoundAt = S.t + (ok ? .45 : 1.3);
  if (S.g.over) gameOver();
}

function missed() {
  L.missRound(S.g);
  sndMiss();
  float(W / 2, H * .42, "这题是 " + S.round.ans, "#cfe9e0", 26);
  S.nextRoundAt = S.t + .9;
}

/* ---------------- 粒子和飘字：游戏的「汁水」都在这儿 ---------------- */

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 90 + Math.random() * 260;
    S.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
                   r: 2 + Math.random() * 4, life: .5 + Math.random() * .5, max: 1, color });
  }
}
/* 接对时把夸奖甩在屏幕中间：先弹出来，再歪着飘上去淡掉。
   这句话是整局里最该被看见的东西，所以它画在最上层，字也给到最大。
   连对三次以上换一套更烫的配色，顺手告诉人「你现在状态不一样」。 */
function pop(text, combo, y) {
  const hot = combo >= 3;
  // 字号按量出来的宽度定一次就够：每帧 measureText + 建渐变，在 iPad 上
  // 正好卡在球下落最密的时候
  let size = Math.round(Math.min(56, W / 7.5));
  const maxW = W * .86 / 1.25;              // 留出弹进来那 1.25 倍的过冲
  ctx.font = popFont(size);
  const w = ctx.measureText(text).width;
  if (w > maxW) size = Math.max(20, Math.floor(size * maxW / w));
  const grd = ctx.createLinearGradient(0, -size / 2, 0, size / 2);
  grd.addColorStop(0, "#fff");
  grd.addColorStop(1, hot ? "#ff9f45" : "#ffd166");
  S.pops.push({
    text, life: 1, hot, size, grd,
    x: W / 2, y: y == null ? H * .36 : y,
    rot: (Math.random() - .5) * .18,
    hue: hot ? 14 : 48,
  });
  if (S.pops.length > 3) S.pops.shift();    // 手快的时候别糊成一堵墙
}

/* 破纪录：整屏彩带。粒子复用同一套，只是从屏幕顶上成片地落，
   颜色杂、带旋转，掉得比火花慢——火花是「这一下很准」，彩带是「这一局成了」。 */
const CONFETTI = ["#ffd166", "#ff9f45", "#5ad2a0", "#53c4ef", "#ff7a9c", "#fff"];
const MAX_PARTS = 240;        // 粒子上限：彩带和火花撞一起时别让帧率背锅
function confetti(n) {
  for (let i = 0; i < n; i++) {
    S.parts.push({
      x: Math.random() * W, y: -10 - Math.random() * H * .3,
      vx: (Math.random() - .5) * 120, vy: 60 + Math.random() * 120,
      r: 3 + Math.random() * 4, life: 1.6 + Math.random() * 1.2, max: 1,
      color: CONFETTI[Math.random() * CONFETTI.length | 0],
      flake: 1, spin: (Math.random() - .5) * 12, rot: Math.random() * 6.3,
    });
  }
}

// 破纪录的号角：往上爬的一串，最后落在一个长音上
function sndFanfare() {
  [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tone(f, .16, "triangle", .13), i * 110));
  setTimeout(() => tone(1319, .5, "triangle", .11), 470);
}

function float(x, y, text, color, size) {
  S.floats.push({ x, y, text, color, size: size || 24, life: 1.1 });
}

/* ---------------- 大象 ---------------- */

function drawElephant(x, y, scale) {
  const s = scale;
  ctx.save();
  ctx.translate(x, y);
  // 接到东西会往上蹦一下、身子压扁一点点——有弹性才像活的
  const hop = Math.sin(S.ele.hop * Math.PI) * 18 * s;
  const sq = 1 + S.ele.squash * .18, st = 1 - S.ele.squash * .14;
  ctx.translate(0, -hop);
  ctx.scale(sq, st);

  ctx.fillStyle = "#fff";
  ctx.beginPath(); ctx.arc(-14 * s, -8 * s, 30 * s, 0, 6.3); ctx.fill();   // 身子
  ctx.beginPath(); ctx.arc(22 * s, -6 * s, 25 * s, 0, 6.3); ctx.fill();    // 脑袋

  // 鼻子：接到东西时会卷起来
  const lift = S.ele.trunk;
  ctx.strokeStyle = "#fff"; ctx.lineCap = "round"; ctx.lineWidth = 15 * s;
  ctx.beginPath();
  ctx.moveTo(26 * s, 14 * s);
  ctx.quadraticCurveTo(44 * s, 26 * s - lift * 26 * s, 30 * s - lift * 6 * s, 40 * s - lift * 44 * s);
  ctx.stroke();

  // 眼睛（偶尔眨一下）
  ctx.fillStyle = "#0d5f4c";
  const open = S.ele.blink > 0 ? .25 : 1;
  ctx.beginPath(); ctx.ellipse(30 * s, -12 * s, 4.6 * s, 4.6 * s * open, 0, 0, 6.3); ctx.fill();
  ctx.restore();
}

/* ---------------- 每帧 ---------------- */

let last = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000 || 0);     // 切后台回来不要一下跳一大步
  last = now;
  if (S.mode === "play") step(dt);
  draw(dt);
}

function step(dt) {
  S.t += dt;

  // 大象跟手：不是瞬移，留一点追赶感，但要足够快，不能「拖不动」
  S.ele.x += (S.ele.target - S.ele.x) * Math.min(1, dt * 16);
  S.ele.hop = Math.max(0, S.ele.hop - dt * 3.2);
  S.ele.squash = Math.max(0, S.ele.squash - dt * 2.4);
  S.ele.trunk = Math.max(0, S.ele.trunk - dt * 2.2);
  S.ele.blink -= dt;
  if (S.ele.blink < -3) S.ele.blink = .12 + Math.random() * .1;
  S.shake = Math.max(0, S.shake - dt * 2.6);
  if (S.flash !== null) { S.flash -= dt; if (S.flash <= 0) S.flash = null; }
  if (S.flashGold) S.flashGold = Math.max(0, S.flashGold - dt * 1.6);
  if (S.banner) { S.banner.t -= dt; if (S.banner.t <= 0) S.banner = null; }

  const ground = GROUND();
  let alive = 0;
  S.items.forEach(it => {
    if (it.dead) { it.dead += dt; return; }
    it.y += it.vy * dt;
    it.sway += dt * 2;
    alive++;
    // 接住判定：篮口比大象本体宽一点，宁可宽松——这个年纪的手没那么准
    // 只认「真的罩住了」：球心离大象中线 catchHalf 以内。
    // 原来那个兜比球还宽一圈，三个球挨近时，去接中间那个的路上
    // 会先把旁边的错答案勾进来
    const dx = Math.abs(it.x + Math.sin(it.sway) * SWAY - S.ele.x);
    if (it.y + it.r >= ground - 18 && it.y - it.r < ground + 26 && dx < L.catchHalf(it.r)) {
      it.dead = .001; it.caught = 1;
      if (!S.round.done) { S.round.done = 1; resolve(it.v === S.round.ans, it.v); }
    } else if (it.y - it.r > H) {
      it.dead = .001;
    }
  });

  // 一个都不剩，又没接着 → 这题漏了
  if (S.round && !S.round.done && S.items.every(it => it.dead)) { S.round.done = 2; missed(); }

  S.parts.forEach(p => {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.vy += (p.flake ? 160 : 900) * dt;          // 彩带要飘，火花要砸
    if (p.flake) { p.rot += p.spin * dt; p.vx *= (1 - dt * .6); }
  });
  S.parts = S.parts.filter(p => p.life > 0);
  if (S.parts.length > MAX_PARTS) S.parts.splice(0, S.parts.length - MAX_PARTS);
  S.floats.forEach(f => { f.life -= dt; f.y -= dt * 40; });
  S.floats = S.floats.filter(f => f.life > 0);
  S.pops.forEach(p => { p.life -= dt * 1.15; p.y -= dt * 46; p.rot *= (1 - dt * 1.5); });
  S.pops = S.pops.filter(p => p.life > 0);

  if (S.round && S.round.done && S.nextRoundAt && S.t >= S.nextRoundAt && !S.g.over) {
    S.nextRoundAt = 0; newRound();
  }
}

function draw(dt) {
  ctx.save();
  if (S.shake > 0) {
    const k = S.shake * 10;
    ctx.translate((Math.random() - .5) * k, (Math.random() - .5) * k);
  }

  // 背景：上深下浅，底下一条草地
  ctx.fillStyle = bgGrad; ctx.fillRect(-20, -20, W + 40, H + 40);
  const ground = GROUND();
  ctx.fillStyle = "#0a4133";
  ctx.fillRect(-20, ground + 24, W + 40, H);

  // 掉下来的数字
  S.items.forEach(it => {
    if (it.dead > .25) return;
    const x = it.x + Math.sin(it.sway) * SWAY;
    const fade = it.dead ? Math.max(0, 1 - it.dead * 4) : 1;
    const pop = it.caught ? 1 + it.dead * 3 : 1;
    ctx.globalAlpha = fade;
    ctx.save(); ctx.translate(x, it.y); ctx.scale(pop, pop);
    ctx.fillStyle = "hsl(" + it.hue + ",85%,62%)";
    ctx.beginPath(); ctx.arc(0, 0, it.r, 0, 6.3); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.35)";
    ctx.beginPath(); ctx.ellipse(-it.r * .3, -it.r * .35, it.r * .3, it.r * .2, -.6, 0, 6.3); ctx.fill();
    ctx.fillStyle = "#20323a";
    ctx.font = "700 " + Math.round(it.r * .92) + "px system-ui,-apple-system,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(String(it.v), 0, 1);
    ctx.restore();
    ctx.globalAlpha = 1;
  });

  // 粒子
  S.parts.forEach(p => {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
    ctx.fillStyle = p.color;
    if (p.flake) {                               // 彩带画成会翻面的小纸片
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillRect(-p.r, -p.r * .5, p.r * 2, Math.max(1.2, p.r * Math.abs(Math.cos(p.rot))));
      ctx.restore();
    } else {
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.3); ctx.fill();
    }
  });
  ctx.globalAlpha = 1;

  drawElephant(S.ele.x, ground, Math.max(.85, Math.min(1.25, W / 420)));

  // 飘字
  S.floats.forEach(f => {
    ctx.globalAlpha = Math.min(1, f.life * 1.4);
    ctx.fillStyle = f.color;
    ctx.font = "800 " + f.size + "px system-ui,-apple-system,sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;

  // 夸奖大字：弹进来（略微过冲）→ 稳住 → 飘上去淡掉
  S.pops.forEach(p => {
    const age = 1 - p.life;
    const k = age < .18 ? (age / .18) : 1;
    const scale = age < .18 ? (.4 + k * .85) : (1.25 - Math.min(1, (age - .18) / .25) * .25);
    ctx.save();
    ctx.globalAlpha = Math.min(1, p.life * 1.8);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.scale(scale, scale);
    const size = p.size;
    ctx.font = popFont(size);
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    // 先描一圈深色边，底下无论是球还是草地都读得清
    ctx.lineWidth = Math.max(6, size * .16);
    ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(6,48,38,.85)";
    ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.grd;
    ctx.fillText(p.text, 0, 0);
    ctx.restore();
  });
  ctx.globalAlpha = 1;

  if (S.flashGold) {
    ctx.fillStyle = "rgba(255,209,102," + (S.flashGold * .35) + ")";
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }
  if (S.flash !== null) {
    ctx.fillStyle = "rgba(255,80,60," + (S.flash * .5) + ")";
    ctx.fillRect(-20, -20, W + 40, H + 40);
  }
  ctx.restore();

  if (S.mode === "play" || S.mode === "pause") drawHud();
}

function headBottom() { return Math.max(124, H * .21); }

function drawHud() {
  // 顶上压一条不透明的带子：题目写在上面，球从带子底下钻出来。
  // 之前题目和球在同一层，球飘过去正好糊住题面，等于逼人背题
  const hb = headBottom();
  ctx.fillStyle = bandGrad; ctx.fillRect(-20, -20, W + 40, hb + 20);
  ctx.fillStyle = "rgba(255,255,255,.10)";
  ctx.fillRect(-20, hb, W + 40, 2);

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = "rgba(255,255,255,.96)";
  ctx.font = "800 " + Math.round(Math.min(48, W / 9)) + "px system-ui,-apple-system,sans-serif";
  if (S.round) {
    ctx.fillText(S.round.q + " = ?", W / 2, headBottom() - 56);
    if (S.round.again) {
      // 补考的题标一下：让人知道「这题刚才错过」，而不是觉得题库在重复
      ctx.save();
      ctx.font = "700 13px system-ui,-apple-system,sans-serif";
      ctx.fillStyle = "#ff9f45";
      ctx.fillText("↻ 刚才错过的题", W / 2, headBottom() - 88);
      ctx.restore();
    }
  }

  ctx.font = "600 15px system-ui,-apple-system,sans-serif";
  ctx.fillStyle = "rgba(255,255,255,.8)";
  ctx.textAlign = "left";
  ctx.fillText("❤".repeat(S.g.lives) || "—", 16, headBottom() - 18);
  ctx.textAlign = "right";
  // 分数旁边挂着当前倍率：知道「往上打更值钱」，才愿意往上打
  const mul = L.levelMul(L.levelFor(S.g.solved));
  ctx.fillText(S.g.score + " 分" + (mul > 1 ? "  ×" + mul.toFixed(1) : ""), W - 16, headBottom() - 18);
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(255,255,255,.55)";
  const lv = L.levelFor(S.g.solved);
  const left = L.leftToClear(S.g.solved);
  ctx.fillText(
    S.endless ? "♾ 无尽模式"
      : lv === L.MAX_LEVEL ? "最后一关 · 还差 " + left + " 题通关"
      : "第 " + lv + " 关 · " + L.stageOf(lv).name,
    W / 2, headBottom() - 18);

  if (S.banner) {
    const b = S.banner, y = headBottom() + (b.big ? 58 : 46);
    ctx.globalAlpha = Math.min(1, b.t);
    // 换主题那一下给个底衬：底下正在掉球，纯文字会被花花绿绿的球搅乱
    if (b.big) {
      ctx.font = "800 " + Math.round(Math.min(27, W / 15)) + "px system-ui,-apple-system,sans-serif";
      if (b.w == null) b.w = ctx.measureText(b.text).width + 36;   // 量一次就够，横幅要飘两秒多
      const w = b.w;
      ctx.fillStyle = "rgba(7,58,47,.9)";
      const x0 = W / 2 - w / 2, h = 62, r = 14;
      ctx.beginPath();
      ctx.moveTo(x0 + r, y - h / 2);
      ctx.arcTo(x0 + w, y - h / 2, x0 + w, y + h / 2, r);
      ctx.arcTo(x0 + w, y + h / 2, x0, y + h / 2, r);
      ctx.arcTo(x0, y + h / 2, x0, y - h / 2, r);
      ctx.arcTo(x0, y - h / 2, x0 + w, y - h / 2, r);
      ctx.fill();
      ctx.strokeStyle = "rgba(255,209,102,.6)"; ctx.lineWidth = 2; ctx.stroke();
    }
    ctx.fillStyle = "#ffd166";
    ctx.font = "800 " + Math.round(Math.min(b.big ? 27 : 24, W / 15)) + "px system-ui,-apple-system,sans-serif";
    ctx.fillText(b.text, W / 2, y - (b.sub ? 11 : 0));
    if (b.sub) {
      ctx.fillStyle = "rgba(255,255,255,.78)";
      ctx.font = "600 14px system-ui,-apple-system,sans-serif";
      ctx.fillText(b.sub, W / 2, y + 15);
    }
    ctx.globalAlpha = 1;
  }
}

/* ---------------- 操作：按住屏幕左右拖 ---------------- */

function aim(clientX) {
  const pad = 40;
  S.ele.target = Math.max(pad, Math.min(W - pad, clientX));
}
cv.addEventListener("pointerdown", e => { audio(); unlockSpeech(); aim(e.clientX); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => { if (e.buttons || e.pointerType === "touch") aim(e.clientX); });
// 电脑上也能玩：方向键
window.addEventListener("keydown", e => {
  if (S.mode !== "play") return;
  if (e.key === "ArrowLeft")  { S.ele.target = Math.max(40, S.ele.target - 60); e.preventDefault(); }
  if (e.key === "ArrowRight") { S.ele.target = Math.min(W - 40, S.ele.target + 60); e.preventDefault(); }
});

/* ---------------- 开局 / 结算 ---------------- */

function start(fromLevel) {
  S.g = L.newGame();
  if (fromLevel > 1) S.g.solved = L.solvedForLevel(fromLevel);   // 选关：直接从那一关开打
  S.items = []; S.parts = []; S.floats = []; S.pops = []; S.banner = null; S.flash = null;
  S.retry = []; S.wrongLog = [];
  S.prevBest = save.best || 0; S.brokeRecord = false; S.flashGold = 0; S.endless = false;
  S.ele.x = S.ele.target = W / 2;
  S.t = 0; S.nextRoundAt = 0;
  S.mode = "play";
  document.body.classList.add("playing");
  layer("start", false); layer("over", false); layer("paused", false); layer("pickwrap", false);
  refreshHome();
  newRound();
  audio();                               // 第一次点按钮时解锁声音，iOS 的规矩
  unlockSpeech();                        // 朗读也得在手势里开闸，同上
}

/* 通关：这是整局唯一的「赢」。该炸的都炸，并且把「接着打」摆出来——
   有人就想继续刷分，不该逼他重开一局从 20 以内加减打起。 */
function victory() {
  S.mode = "over";
  document.body.classList.remove("playing");
  if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
  confetti(160);
  sndFanfare();
  setTimeout(sndFanfare, 600);
  S.flashGold = 1;
  save.cleared = (save.cleared || 0) + 1;
  save.unlocked = L.unlockTo(save.unlocked, L.MAX_LEVEL);
  const prevBest = save.best || 0, prevCombo = save.bestCombo || 0;
  save.best = Math.max(prevBest, S.g.score);
  save.bestCombo = Math.max(prevCombo, S.g.bestCombo);
  save.solved = (save.solved || 0);
  persist();

  $("overtitle").textContent = "🎉 通关啦！";
  $("overstat").innerHTML =
    '<div class="big">' + S.g.score + " 分</div>" +
    '<div class="combo">🔥 最长连对 <em>' + S.g.bestCombo + "</em> 题</div>" +
    "答对 <em>" + L.CLEAR_AT + "</em> 题，十二关全打完了　剩 <em>" + S.g.lives + "</em> 颗心<br>" +
    "最高分 <em>" + save.best + "</em>　这是第 <em>" + save.cleared + "</em> 次通关" +
    (S.wrongLog.length
      ? '<div class="wrongs"><b>这几题再看一眼：</b>' +
        S.wrongLog.slice(0, 5).map(x => "<span>" + x.q + " = " + x.ans + "</span>").join("") +
        (S.wrongLog.length > 5 ? "<span>…</span>" : "") + "</div>"
      : "");
  $("endless").style.display = "";
  setTimeout(() => { layer("over", true); refreshHome(); }, 1100);  // 彩带先飘一会儿
}

function gameOver() {
  S.mode = "over";
  document.body.classList.remove("playing");
  if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
  save.plays = (save.plays || 0) + 1;
  // 先把「原来的纪录」记下来再更新，否则一比就永远是「刷新了纪录」
  const prevBest = save.best || 0, prevCombo = save.bestCombo || 0;
  const bestCombo = S.g.bestCombo;
  const isBest = S.g.score > prevBest && S.g.score > 0;
  const isComboBest = bestCombo > prevCombo && bestCombo > 0;
  save.best = Math.max(prevBest, S.g.score);
  save.bestCombo = Math.max(prevCombo, bestCombo);
  persist();
  $("overtitle").textContent = isBest ? "🏆 新纪录！" : "这局结束";
  $("endless").style.display = "none";
  if (isBest && !S.brokeRecord) { confetti(70); sndFanfare(); }   // 开局时还没有纪录的那种
  const lvEnd = L.levelFor(S.g.solved);
  $("overstat").innerHTML =
    '<div class="big">' + S.g.score + " 分</div>" +
    '<div class="combo">🔥 最长连对 <em>' + bestCombo + "</em> 题" +
    (isComboBest ? "　<b>刷新了连对纪录</b>" : "") + "</div>" +
    "答对 <em>" + S.g.solved + "</em> 题　打到 <em>第 " + lvEnd + " 关</em>（" + L.stageOf(lvEnd).name + "）<br>" +
    "最高分 <em>" + save.best + "</em>　历史最长连对 <em>" + (save.bestCombo || 0) + "</em> 题" +
    (S.wrongLog.length
      ? '<div class="wrongs"><b>这几题再看一眼：</b>' +
        S.wrongLog.slice(0, 5).map(x => "<span>" + x.q + " = " + x.ans + "</span>").join("") +
        (S.wrongLog.length > 5 ? "<span>…</span>" : "") + "</div>"
      : "");
  setTimeout(() => { layer("over", true); refreshHome(); }, 650);   // 让最后那下动画播完再盖上
}

function refreshVoiceBtn() {
  $("voicebtn").textContent = save.voice ? "🔊 夸奖语音：开（英文）" : "🔈 夸奖语音：关";
}
$("voicebtn").onclick = () => {
  unlockSpeech();
  save.voice = !save.voice;
  persist();
  refreshVoiceBtn();
  if (save.voice) speakPraise(L.praisePhrase(1), 9);   // 开的时候出个声，省得人不知道有没有生效
  else if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
};

function renderPick() {
  const box = $("pick");
  let h = "";
  L.STAGES.forEach((st, si) => {
    h += '<div class="st">' + (si + 1) + "、" + st.name + '</div><div class="lvrow">';
    for (let k = 0; k < L.LEVELS_PER_STAGE; k++) {
      const lv = si * L.LEVELS_PER_STAGE + k + 1;
      if (lv > L.MAX_LEVEL) break;
      const open = lv <= save.unlocked;
      h += '<button class="lv' + (open ? (lv === save.unlocked ? " on" : "") : " lock") + '"' +
           (open ? ' data-lv="' + lv + '"' : " disabled") +
           ">" + (open ? "第 " + lv + " 关" : "🔒 " + lv) + "</button>";
    }
    h += "</div>";
  });
  box.innerHTML = h;
  box.querySelectorAll("button.lv[data-lv]").forEach(b => {
    b.onclick = () => start(+b.dataset.lv);
  });
}

function openPick() {
  renderPick();
  layer("start", false); layer("over", false); layer("pickwrap", true);
  refreshHome();
}

function refreshStart() {
  refreshVoiceBtn();
  const un = save.unlocked || 1;
  $("startstat").innerHTML =
    (un > 1 ? "从 <em>第 " + un + " 关 · " + L.stageOf(un).name + "</em> 接着打<br>" : "") +
    (save.best ? "最高分 <em>" + save.best + "</em>　累计答对 <em>" + (save.solved || 0) + "</em> 题" : "") +
    (save.cleared ? "<br>🏁 已通关 <em>" + save.cleared + "</em> 次" : "");
}

// 「开始」从解锁到的那一关接着打：每次都从 20 以内加减重来，很快就腻了
$("go").onclick = () => start(save.unlocked || 1);
$("again").onclick = () => start(L.levelFor(S.g.solved));
$("pickbtn").onclick = openPick;
$("pickbtn2").onclick = openPick;
/* 左上角那个「返回」：游戏里按它是回到开始界面，不是直接离开网站。
   原来写的是一个 <a href="index.html">，玩到一半手一抖就整个页面走了，
   这一局也没了。只有已经在开始界面（或选关界面）时，它才真的回首页。 */
function goBack() {
  if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
  if (S.mode === "play" || S.mode === "pause" || S.mode === "over") {
    S.mode = "ready";
    document.body.classList.remove("playing");
    S.items = []; S.parts = []; S.floats = []; S.pops = [];
    layer("paused", false); layer("over", false); layer("pickwrap", false);
    layer("start", true);
    refreshStart();
    refreshHome();
    return;
  }
  if ($("pickwrap").classList.contains("show")) {     // 在选关页，先退回开始界面
    layer("pickwrap", false); layer("start", true); refreshStart(); refreshHome();
    return;
  }
  location.href = "index.html";
}

// 在开始界面上，这个按钮的意思是「离开这个游戏」，字也跟着换，省得人以为还能再退一层
function refreshHome() {
  const inGame = S.mode === "play" || S.mode === "pause" || S.mode === "over" ||
                 $("pickwrap").classList.contains("show");
  $("homebtn").textContent = inGame ? "‹ 返回" : "‹ 回首页";
}

$("homebtn").onclick = goBack;

$("endless").onclick = () => {
  // 接着打：心和分数都留着，关卡停在最高那一档，不再有通关判定
  S.endless = true;
  S.mode = "play";
  document.body.classList.add("playing");
  layer("over", false);
  newRound();
};
$("pickback").onclick = () => { layer("pickwrap", false); layer("start", true); refreshStart(); refreshHome(); };
$("back").onclick = () => { location.href = "index.html"; };
$("pausebtn").onclick = () => {
  if (S.mode === "play") { S.mode = "pause"; layer("paused", true); }
  else if (S.mode === "pause") { S.mode = "play"; layer("paused", false); }
};
$("resume").onclick = () => { S.mode = "play"; layer("paused", false); };

// 切到别的 App 自动暂停：回来时不会发现三颗心已经掉光了
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden" && S.mode === "play") {
    S.mode = "pause"; layer("paused", true);
    if (window.speechSynthesis) { try { speechSynthesis.cancel(); } catch (e) {} }
  }
});

refreshStart();
refreshHome();
requestAnimationFrame(frame);
</script>
